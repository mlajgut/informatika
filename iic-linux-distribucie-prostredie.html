<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OS Linux – distribúcie a prostredie · II.C</title>
<meta name="author" content="Miroslav Lajgút">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Kancelársky stôl: každý šanón je zložka so štítkom; aktivity sú listy v zložke. */
:root{
  --desk:#EDF1FA;--paper:#FFFFFF;--paper2:#F5F7FD;--ink:#1E1B3A;--muted:#55527A;--line:#1E1B3A;--hair:#D2D8EC;--soft:#E3E8FA;--shadow:#1E1B3A;
  --acc:#3B4CCB;--on-acc:#FFFFFF;--cpu:#2B5FD9;--ram:#7E47DB;--disk:#0F8A45;--net:#D9561A;
  --sun:#FFC93C;--mint:#2EC4B6;--coral:#FF8A80;--sky:#62D2F3;--lilac:#CDAEF7;--peach:#FFB98F;--lime:#C3E670;--rose:#F8AED3;
  --on-bright:#1E1B3A;
  --ok:#11743C;--okbg:#DCF2E4;--bad:#BF2830;--badbg:#FBE3E3;--warn:#8A5700;--warnbg:#FFF0C9;--stamp:#C3233F;
  --go:#2BB673;--mid:#F2A50C;--stop:#E5484D;--pl:#FFF6CC;--plb:#B8860B;
  --fh:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --fb:"Nunito","Segoe UI",system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#13122A;--paper:#1E1C3F;--paper2:#191838;--ink:#F0EEFF;--muted:#B6B2DE;--line:#8D86D6;--hair:#35325F;--soft:#2A2756;--shadow:#06050F;
  --acc:#909CFF;--on-acc:#12102A;--cpu:#8AABFF;--ram:#BC9BFF;--disk:#5BD893;--net:#FFA06C;
  --ok:#62DE9B;--okbg:#163A29;--bad:#FF8E8E;--badbg:#47192A;--warn:#FFCB6B;--warnbg:#3D2E12;--stamp:#FF7590;--pl:#3A3214;--plb:#E9C46A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#13122A;--paper:#1E1C3F;--paper2:#191838;--ink:#F0EEFF;--muted:#B6B2DE;--line:#8D86D6;--hair:#35325F;--soft:#2A2756;--shadow:#06050F;
  --acc:#909CFF;--on-acc:#12102A;--cpu:#8AABFF;--ram:#BC9BFF;--disk:#5BD893;--net:#FFA06C;
  --ok:#62DE9B;--okbg:#163A29;--bad:#FF8E8E;--badbg:#47192A;--warn:#FFCB6B;--warnbg:#3D2E12;--stamp:#FF7590;--pl:#3A3214;--plb:#E9C46A;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:120px}
html.board{font-size:125%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 1rem/1.55 var(--fb);overflow-x:hidden;
  background-image:radial-gradient(var(--hair) 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.2;margin:0 0 .5em;font-weight:600}
p{margin:0 0 .8em}
a{color:var(--acc)}
code,.mono{font-family:var(--fm);font-size:.92em}
kbd{font-family:var(--fm);font-size:.85em;background:var(--paper2);border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 .35em;white-space:nowrap}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top)}
.topin{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.logo svg{width:36px;height:36px;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.15;text-align:left;min-width:0}
.brand b{font-family:var(--fh);font-weight:600;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:.78rem}
.sp{flex:1}
.xp{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.9rem}
.xpbar{width:90px;height:10px;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper2)}
.xpbar i{display:block;height:100%;background:var(--sun);width:0;transition:width .4s}
.rank{font-size:.78rem;color:var(--muted);font-weight:700}
.hbtn{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;cursor:pointer;font-weight:800;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.hbtn:hover{background:var(--soft)}
.hbtn svg{width:18px;height:18px}
.lang{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{border:0;background:var(--paper);padding:5px 9px;cursor:pointer;font-weight:800;font-size:.85rem;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:thin}
.nav a{flex:none;text-decoration:none;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:2px 10px 2px 4px;font-weight:700;font-size:.8rem;display:inline-flex;align-items:center;gap:6px;background:var(--paper)}
.nav a .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on-bright);font-family:var(--fh);font-size:.78rem;border:1.5px solid var(--line)}
.nav a.ok .n{background:var(--ok);color:var(--paper)}
.nav a.bn{border-style:dashed}
@media (max-width:640px){.brand{display:none}.xpbar{width:56px}.rank{display:none}.hbtn .lbl{display:none}}
/* ---------- hero ---------- */
.hero{padding:26px 0 8px}
.kicker{display:inline-block;font-family:var(--fm);font-size:.78rem;font-weight:700;background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:6px;letter-spacing:.02em}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.6rem);margin:.4em 0 .3em}
.story{background:var(--paper);border:2px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--shadow);padding:18px;margin:14px 0}
.cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 4px}
@media (max-width:640px){.cast{grid-template-columns:repeat(2,minmax(0,1fr))}}
.who{border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:10px 8px;cursor:pointer;text-align:center;font-weight:800}
.who svg{width:64px;height:64px;display:block;margin:0 auto 4px}
.who small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
.who[aria-expanded="true"]{background:var(--soft);box-shadow:3px 3px 0 var(--shadow)}
.bubble{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.bubble::before{content:"";position:absolute;top:-10px;left:var(--bx,40px);width:16px;height:16px;background:var(--paper);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg)}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
@media (max-width:640px){.goals{grid-template-columns:minmax(0,1fr)}}
.goal{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px}
.goal svg{width:26px;height:26px;flex:none;color:var(--acc)}
.plan{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.plan li{display:flex;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:6px 10px}
.plan .n{width:26px;height:26px;border-radius:50%;background:var(--c);border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--fh);color:var(--on-bright);flex:none}
.plan .m{margin-left:auto;font-family:var(--fm);font-size:.82rem;color:var(--muted);white-space:nowrap}
.plan li.bn{border-style:dashed}
/* ---------- folders (šanóny) ---------- */
.lvl{margin:44px 0 0;position:relative}
.tab{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:var(--on-bright);border:2px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:6px 14px 6px 8px;font-family:var(--fh);font-weight:600;position:relative;top:2px;max-width:100%}
.tab .n{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:0 7px;font-size:.9rem}
.tab .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder{background:var(--paper);border:2px solid var(--line);border-radius:0 16px 16px 16px;box-shadow:6px 6px 0 var(--shadow);padding:18px 18px 10px;position:relative;border-top:8px solid var(--c)}
.fhead{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.fhead h2{font-size:clamp(1.25rem,3vw,1.6rem);flex:1;min-width:200px;margin:0}
.clock{border:2px solid var(--line);background:var(--paper2);border-radius:999px;padding:3px 10px;font-family:var(--fm);font-weight:700;font-size:.82rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:32px}
.clock svg{width:16px;height:16px}
.bonus-tag{font-family:var(--fm);font-size:.75rem;border:1.5px dashed var(--line);border-radius:6px;padding:2px 6px;font-weight:700}
.stamp{position:absolute;right:18px;top:-18px;transform:rotate(8deg);border:3px solid var(--stamp);color:var(--stamp);font-family:var(--fh);font-weight:700;font-size:1.05rem;padding:2px 12px;border-radius:8px;background:var(--paper);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.lead{font-size:1.03rem}
.explain{background:var(--paper2);border:2px solid var(--hair);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px;margin:10px 0}
.explain h4{font-size:1rem;margin-bottom:.35em}
.explain ul{margin:.2em 0 .4em;padding-left:1.2em}
.explain li{margin:.15em 0}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
@media (max-width:700px){.cards3,.cards2{grid-template-columns:minmax(0,1fr)}.cards3.catg{grid-template-columns:repeat(2,minmax(0,1fr));font-size:.88rem}}
.mini{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.mini b{font-family:var(--fh);font-weight:600}
.term{font-weight:800}
.path{font-family:var(--fm);font-size:.86em;background:var(--soft);border-radius:6px;padding:1px 6px;white-space:normal;overflow-wrap:anywhere}
/* ---------- activities ---------- */
.act{border-top:2.5px dashed var(--hair);padding:16px 0 12px;margin-top:12px}
.ahead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ahead h3{font-size:1.12rem;margin:0}
.kind{font-family:var(--fm);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 7px}
.adone{margin-left:auto;font-size:.8rem;font-weight:800;color:var(--ok);display:inline-flex;gap:4px;align-items:center}
.adone svg{width:16px;height:16px}
.btn{border:2px solid var(--line);background:var(--acc);color:var(--on-acc);border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.small{padding:4px 10px;min-height:32px;font-size:.88rem;box-shadow:2px 2px 0 var(--shadow)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.opts{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:640px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font-weight:700;min-height:44px;width:100%}
.opt:hover{background:var(--soft)}
.opt[aria-pressed="true"]{background:var(--soft);box-shadow:inset 0 0 0 2px var(--acc)}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.badc{background:var(--badbg);border-color:var(--bad)}
.opt[aria-disabled="true"]{cursor:default}
.fb{border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:600;border:2px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.fb.no{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.fb.info{background:var(--warnbg);border-color:var(--warn);color:var(--ink)}
.fb b:first-child{font-family:var(--fh)}
/* worksheet box */
.pl{background:var(--pl);border:2.5px dashed var(--plb);border-radius:12px;padding:10px 12px;margin:12px 0 4px;display:flex;gap:10px;align-items:flex-start}
.pl svg{width:24px;height:24px;flex:none;color:var(--plb)}
.pl b{font-family:var(--fh);font-weight:600}
/* sorting / tickets */
.ticket{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);margin:8px 0}
.ticket .q{font-weight:700;margin-bottom:6px}
.ticket .who2{font-size:.8rem;color:var(--muted);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--paper2);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip.good{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.chip.badc{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
/* envelope */
.env{border:2px solid var(--line);border-radius:14px;background:repeating-linear-gradient(135deg,var(--paper2) 0 12px,var(--paper) 12px 24px);padding:14px;position:relative}
.env.sealed::after{content:"";position:absolute;right:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--stamp);opacity:.85}
/* task manager */
.win{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);box-shadow:4px 4px 0 var(--shadow)}
.wbar{display:flex;align-items:center;gap:8px;background:var(--soft);border-bottom:2px solid var(--line);padding:6px 10px;font-weight:800;font-size:.9rem}
.wbar .dots{margin-left:auto;display:flex;gap:6px}
.wbar .dots i{width:12px;height:12px;border:1.5px solid var(--line);border-radius:3px;display:block}
.wtabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1.5px solid var(--hair);overflow-x:auto;font-size:.82rem;font-weight:700}
.wtabs span{padding:3px 8px;border-radius:6px;white-space:nowrap;color:var(--muted)}
.wtabs span.on{background:var(--ink);color:var(--paper)}
.tmw{overflow-x:auto}
table.tm{width:100%;border-collapse:collapse;font-size:.86rem;min-width:520px}
.tm th{font-family:var(--fm);font-size:.74rem;text-align:right;padding:6px 8px;border-bottom:2px solid var(--line);background:var(--paper2);cursor:pointer;white-space:nowrap}
.tm th:first-child,.tm td:first-child{text-align:left}
.tm td{padding:6px 8px;border-bottom:1px solid var(--hair);text-align:right;font-family:var(--fm);font-size:.82rem;white-space:nowrap}
.tm td:first-child{font-family:var(--fb);font-weight:700;font-size:.88rem;white-space:normal}
.tm tr{cursor:pointer}
.tm tr.sel td{background:var(--soft);box-shadow:inset 0 2px 0 var(--acc),inset 0 -2px 0 var(--acc)}
.tm tr.ended td{text-decoration:line-through;opacity:.45}
.tm .grp td{background:var(--paper2);font-family:var(--fh);font-size:.82rem;color:var(--muted);cursor:default}
.heat1{background:color-mix(in srgb,var(--sun) 25%,transparent)}
.heat2{background:color-mix(in srgb,var(--peach) 55%,transparent)}
.heat3{background:color-mix(in srgb,var(--coral) 70%,transparent)}
.stat{color:var(--bad);font-weight:800;font-size:.75rem;font-family:var(--fb)}
.sysb{font-size:.7rem;border:1.5px solid var(--line);border-radius:5px;padding:0 4px;margin-left:4px;font-family:var(--fm);font-weight:700;color:var(--muted)}
.wfoot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;border-top:2px solid var(--line);background:var(--paper2)}
.meter{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--fm);font-size:.8rem;font-weight:700}
.meter span{display:inline-flex;gap:4px;align-items:center}
.meter i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* toggles */
.sw{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;background:var(--paper)}
.sw .nm{flex:1;min-width:0;font-weight:700}
.sw .nm small{display:block;color:var(--muted);font-weight:600}
.imp{font-family:var(--fm);font-size:.75rem;font-weight:700;border-radius:6px;padding:2px 6px;border:1.5px solid var(--line);white-space:nowrap}
.imp.h{background:var(--badbg)}.imp.m{background:var(--warnbg)}.imp.l{background:var(--okbg)}.imp.n{background:var(--paper2)}
.tog{width:52px;height:30px;border-radius:999px;border:2px solid var(--line);background:var(--paper2);position:relative;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:left .2s}
.tog[aria-checked="true"]{background:var(--acc)}
.tog[aria-checked="true"]::after{left:25px;background:var(--on-acc)}
.tog[aria-disabled="true"]{opacity:.6;cursor:default}
.sw.good{border-color:var(--ok);background:var(--okbg)}.sw.badc{border-color:var(--bad);background:var(--badbg)}
.boot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;font-weight:800}
.bootbar{flex:1;min-width:160px;height:16px;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper2)}
.bootbar i{display:block;height:100%;background:var(--coral);transition:width .35s}
/* storage */
.disk{height:26px;border:2px solid var(--line);border-radius:8px;overflow:hidden;display:flex;background:var(--paper2);margin:8px 0}
.disk i{display:block;height:100%}
.disk .used{background:var(--ram)}.disk .fr{background:var(--go)}
.chk{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;cursor:pointer;background:var(--paper)}
.chk .box{width:24px;height:24px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;flex:none;background:var(--paper)}
.chk[aria-checked="true"] .box{background:var(--acc);color:var(--on-acc)}
.chk .box svg{width:16px;height:16px}
.chk .nm{flex:1;min-width:0;font-weight:700}
.chk .nm small{display:block;color:var(--muted);font-weight:600}
.chk .gb{font-family:var(--fm);font-weight:700;white-space:nowrap}
.chk.good{border-color:var(--ok);background:var(--okbg)}.chk.badc{border-color:var(--bad);background:var(--badbg)}
.chk[aria-disabled="true"]{cursor:default}
/* true / myth, semafor */
.tf{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--paper)}
.tf .s{font-weight:700;margin-bottom:6px}
.tf .ex{font-size:.92rem;margin-top:6px;color:var(--ink)}
.tf.good{border-color:var(--ok);background:var(--okbg)}.tf.badc{border-color:var(--bad);background:var(--badbg)}
.lights{display:flex;gap:6px;flex-wrap:wrap}
.light{border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;display:inline-flex;align-items:center;gap:6px;background:var(--paper);font-weight:700;cursor:pointer;min-height:36px;font-size:.88rem}
.light i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:block}
.light[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--acc);background:var(--soft)}
/* pairing */
.pairs{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 34px}
.pcol{display:grid;gap:8px;align-content:start}

const A={}; // A[key]={sec,max,render(),on(verb,arg,el)}
function reg(key,def){A[key]=def}
const MAXXP=()=>Object.keys(A).reduce((s,k)=>s+(A[k].max||0)*10,0);
function award(k,got){
  if(S.pts[k])return false;
  const max=A[k].max||0;got=clamp(got,0,max);
  S.pts[k]=[got,max];S.xp+=got*10;save();
  if(got>0)toast(`+${got*10} XP`);
  checkRank();return true;
}
function finish(k){
  const s=st(k);if(s.done)return;s.done=1;save();
  const sec=A[k].sec;const so=SEC(sec);
  if(so&&so.req.every(r=>st(r).done)&&!S.done[sec]){
    S.done[sec]=1;S.act.doneAt[sec]=S.act.t;save();
    setTimeout(()=>toast(fill(t('secDone'),{n:tr(so.tab)})),900);
    renderNav();
  }
}
function rankIdx(){const f=MAXXP()?S.xp/MAXXP():0;let r=0;RANKS.forEach((x,i)=>{if(f>=x[0])r=i});return r}
function checkRank(){const r=rankIdx();if(r>S.ranked){S.ranked=r;save();setTimeout(()=>toast(fill(t('rankUp'),{r:tr(RANKS[r][1])})),1800)}renderTop()}

const GRADES=[[90,['výborný (1)','jeles (1)']],[75,['chválitebný (2)','dicséretes (2)']],[50,['dobrý (3)','jó (3)']],[25,['dostatočný (4)','elégséges (4)']],[0,['nedostatočný (5)','elégtelen (5)']]];
const gradeOf=p=>{for(const g of GRADES)if(p>=g[0])return g;return GRADES[4]};
const gradeNum=p=>GRADES.indexOf(gradeOf(p))+1;
const TFULL=15*60; // 15 min aktívnej práce = 100 %
function results(){
  let got=0,max=0;
  GRADED.forEach(id=>SEC(id).req.forEach(k=>{max+=A[k].max;if(S.pts[k])got+=S.pts[k][0]}));
  const tasks=max?got/max:0;
  const test=S.test.first==null?0:S.test.first/TQ.length;
  const time=clamp(S.act.t/TFULL,0,1);
  const total=Math.round((.4*test+.4*tasks+.2*time)*100);
  return {tasksGot:got,tasksMax:max,tasks:Math.round(tasks*100),test:Math.round(test*100),testRaw:S.test.first,time:Math.round(time*100),total,grade:gradeNum(total)};
}

let logoClicks=[];
function onUi(verb,arg){
  if(verb==='lang'){LI=+arg;store.set(LKEY,String(LI));document.documentElement.lang=LI?'hu':'sk';renderAll();return}
  if(verb==='theme'){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';store.set(THKEY,r.dataset.theme);renderTop();return}
  if(verb==='who'){openWho=openWho===arg?null:arg;renderHero();return}
  if(verb==='timer'){timerOpen(arg);return}
  if(verb==='tpause'){TM.run=!TM.run;timerDraw();return}
  if(verb==='tplus'){TM.left+=60;timerDraw();return}
  if(verb==='tclose'){TM.id=null;clearInterval(TM.h);timerDraw();return}
  if(verb==='teacher'){openTeacher();return}
  if(verb==='logo'){const n=Date.now();logoClicks=logoClicks.filter(x=>n-x<2500);logoClicks.push(n);if(false){logoClicks=[];showTeacher=true;renderTop();openTeacher()}else{window.scrollTo({top:0,behavior:'smooth'})}return}
}
document.addEventListener('click',e=>{

  const [key,verb,...rest]=b.getAttribute('data-a').split(':');const arg=rest.join(':');
  if(key==='ui'){onUi(verb,arg);return}
  if(key==='tp'){onTeacher(verb,arg,b);return}
  if(A[key]&&A[key].on){A[key].on(verb,arg,b);save();rerender(A[key].sec);(A[key].also||[]).forEach(x=>{renderSec(x)});if(A[key].also)requestAnimationFrame(afterRender)}
});

function sortAct(key,sec,items,cats){
  reg(key,{sec,max:items.length,on(v,a){const s=st(key);s.p=s.p||{};
    if(v==='pick'&&!s.checked){const [id,c]=a.split('|');s.p[id]=c}
    if(v==='check'&&!s.checked&&items.every(x=>s.p[x.id])){s.checked=1;award(key,items.filter(x=>s.p[x.id]===x.ok).length);finish(key)}
    if(v==='retry'){s.p={};s.checked=0}
  }});
}
function sortRender(key,items,cats,okMin){
  const k=st(key);k.p=k.p||{};const all=items.every(x=>k.p[x.id]);
  const got=items.filter(x=>k.p[x.id]===x.ok).length;
  return items.map((x,i)=>{const p=k.p[x.id];return `<div class="ticket"><div class="q">${i+1}. ${tr(x.n)}</div>
    <div class="chips">${cats.map(o=>{let c='';if(k.checked&&p===o.id)c=p===x.ok?'good':'badc';if(k.checked&&p!==x.ok&&o.id===x.ok)c='good';
      return `<button class="chip ${c}" data-a="${key}:pick:${x.id}|${o.id}" aria-pressed="${p===o.id}" ${k.checked?'aria-disabled="true"':''}>${esc(tr(o.n))}</button>`}).join('')}</div>

     :`<button class="btn" data-a="${key}:check" ${all?'':'aria-disabled="true"'}>${esc(t('check'))}</button>`}</div>`;

/* rozhodovanie: pri každej situácii jedna voľba, okamžitá spätná väzba */
function decAct(key,sec,list){
  reg(key,{sec,max:list.length,on(v,a){const s=st(key);s.p=s.p||{};
    if(v==='pick'){const [id,val]=a.split('|');if(s.p[id]==null){s.p[id]=+val;if(list.every(x=>s.p[x.id]!=null)){award(key,list.filter(x=>s.p[x.id]===0).length);finish(key)}}}
  }});
}
function decRender(key,list){
  const s=st(key);s.p=s.p||{};
  return list.map((x,i)=>{const p=s.p[x.id];const c=p==null?'':(p===0?'good':'badc');const order=dshuffle(x.o.map((_,j)=>j),key+x.id);

      return `<button class="chip ${cc}" data-a="${key}:pick:${x.id}|${j}" aria-pressed="${p===j}" ${p!=null?'aria-disabled="true"':''}>${esc(tr(x.o[j]))}</button>`}).join('')}</div>
    ${p!=null?`<div class="ex"><b>${p===0?esc(t('correct')):esc(t('wrong'))+' '+tr(['Lepšia voľba:','Jobb választás:'])+' '+esc(tr(x.o[0]))+'.'}</b> ${esc(tr(x.ex))}</div>`:''}</div>`}).join('')+
   (S.pts[key]?`<div class="fb ok">${tr(['Body za prvý pokus: ','Pontok az első próbálkozásért: '])}<b>${S.pts[key][0]} / ${list.length}</b></div>`:'');
}
/* spájanie dvojíc čiarami (ľavá položka → pravá) */
function pairAct(key,sec,pairs){
  reg(key,{sec,max:pairs.length,on(v,a){const s=st(key);s.l=s.l||{};
    if(s.checked&&v!=='retry')return;
    if(v==='L'){s.cur=s.cur===a?null:a}
    if(v==='R'&&s.cur){for(const k in s.l)if(s.l[k]===a)delete s.l[k];s.l[s.cur]=a;s.cur=null}
    if(v==='check'&&pairs.every(p=>s.l[p.id])){s.checked=1;award(key,pairs.filter(p=>s.l[p.id]===p.id).length);finish(key)}
    if(v==='retry'){s.checked=0;s.l={};s.cur=null}
  }});
  AFTER.push(()=>drawLines(key,pairs));
}
function drawLines(key,pairs){
  const box=$('#'+key+'Box');if(!box)return;const svg=$('#'+key+'Svg');const s=st(key);s.l=s.l||{};
  const br=box.getBoundingClientRect();let h='';
  for(const p of pairs){const c=s.l[p.id];if(!c)continue;const L=$(`[data-a="${key}:L:${p.id}"]`,box),R=$(`[data-a="${key}:R:${c}"]`,box);if(!L||!R)continue;
    const a=L.getBoundingClientRect(),b=R.getBoundingClientRect();const cls=s.checked?(c===p.id?'good':'badc'):'';
    h+=`<line class="${cls}" x1="${a.right-br.left}" y1="${a.top+a.height/2-br.top}" x2="${b.left-br.left}" y2="${b.top+b.height/2-br.top}"/>`}
  svg.innerHTML=h;
}

const HOME='/home/adam';
const FS0=()=>({'/home/adam':['Dokumenty/','Obrázky/','Stiahnuté/','poznamky.txt','.config/'],'/home/adam/Dokumenty':['referat.odt'],'/home/adam/Obrázky':['vylet.jpg'],'/home/adam/Stiahnuté':['navod.pdf'],'/home/adam/.config':[]});
const TGOALS=[
  {id:'g1',n:['Zistite, v ktorom priečinku ste (<code>pwd</code>).','Derítsétek ki, melyik mappában vagytok (<code>pwd</code>).']},
  {id:'g2',n:['Vypíšte obsah priečinka (<code>ls</code>).','Listázzátok ki a mappa tartalmát (<code>ls</code>).']},
  {id:'g3',n:['Prejdite do priečinka Dokumenty (<code>cd</code> …). Pozor na veľké písmená!','Lépjetek be a Dokumenty mappába (<code>cd</code> …). Figyeljetek a nagybetűkre!']},
  {id:'g4',n:['V Dokumentoch vytvorte priečinok <b>projekt</b> (<code>mkdir</code> …) a overte ho cez <code>ls</code>.','A Dokumenty mappában hozzátok létre a <b>projekt</b> mappát (<code>mkdir</code> …), és ellenőrizzétek <code>ls</code>-sel.']},
  {id:'g5',n:['Vráťte sa domov (<code>cd ~</code>) a ukážte aj skryté súbory (<code>ls -a</code>).','Térjetek vissza a saját mappába (<code>cd ~</code>), és mutassátok meg a rejtett fájlokat is (<code>ls -a</code>).']},
];
reg('term',{sec:'s6',max:5,on(v){const s=st('term');if(v==='reset'){delete s.fs;s.cwd=HOME;s.log=[];s.g={};s.mk=0}}});
function tState(){const s=st('term');if(!s.fs)s.fs=FS0();if(!s.cwd)s.cwd=HOME;s.log=s.log||[];s.g=s.g||{};return s}
const short=p=>p===HOME?'~':p.startsWith(HOME+'/')?'~'+p.slice(HOME.length):p;
function tRun(line){
  const s=tState();const cmd=line.trim();const out=[];const hint=[];
  s.log.push({p:short(s.cwd),c:cmd});
  const [c,...args]=cmd.split(/\s+/);const arg=args.join(' ');
  const list=p=>(s.fs[p]||[]);
  if(!cmd){}
  else if(c==='pwd'){out.push(s.cwd);s.g.g1=1}
  else if(c==='ls'){const all=args.includes('-a');const items=list(s.cwd).filter(x=>all||!x.startsWith('.'));out.push((all?['./','../']:[]).concat(items).join('  ')||'');if(s.cwd===HOME&&!all)s.g.g2=1;if(all&&s.cwd===HOME)s.g.g5=1;if(s.cwd===HOME+'/Dokumenty'&&s.mk)s.g.g4=1}
  else if(c==='cd'){
    if(!arg||arg==='~'){s.cwd=HOME}
    else if(arg==='..'){if(s.cwd!=='/')s.cwd=s.cwd.split('/').slice(0,-1).join('/')||'/'}
    else{const nm=arg.replace(/\/$/,'');const tgt=nm.startsWith('/')?nm:(s.cwd==='/'?'':s.cwd)+'/'+nm.replace(/^~\//,'');const real=nm.startsWith('~/')?HOME+'/'+nm.slice(2):tgt;
      if(s.fs[real]){s.cwd=real}else{out.push(`bash: cd: ${arg}: No such file or directory`);
        if(list(s.cwd).some(x=>x.replace(/\/$/,'').toLowerCase()===nm.toLowerCase()))hint.push(['Linux rozlišuje veľké a malé písmená – skúste presne tak, ako to vypísal príkaz ls.','A Linux megkülönbözteti a kis- és nagybetűket – írjátok pontosan úgy, ahogy az ls kiírta.'])}}
    if(s.cwd===HOME+'/Dokumenty')s.g.g3=1}
  else if(c==='mkdir'){if(!arg){out.push('mkdir: missing operand')}else{const nm=arg.replace(/\/$/,'');const p=s.cwd+'/'+nm;
      if(list(s.cwd).includes(nm+'/')){out.push(`mkdir: cannot create directory '${nm}': File exists`)}else{s.fs[s.cwd]=list(s.cwd).concat(nm+'/');s.fs[p]=[];if(s.cwd===HOME+'/Dokumenty'&&nm==='projekt')s.mk=1}}}
  else if(c==='whoami'){out.push('adam')}
  else if(c==='cat'){if(arg==='poznamky.txt'&&s.cwd===HOME)out.push(LI?'Bevásárlás: kenyér, tej. Holnap: Linux teszt!':'Nákup: chlieb, mlieko. Zajtra: test z Linuxu!');else out.push(`cat: ${arg||''}: No such file or directory`)}
  else if(c==='clear'){s.log=[]}
  else if(c==='help'){out.push('pwd  ls  ls -a  cd <priečinok>  cd ..  cd ~  mkdir <meno>  cat <súbor>  whoami  clear')}
  else if(c==='rm'||c==='rmdir'){out.push(LI?'(Szimuláció) A törlés itt nem engedélyezett.':'(Simulácia) Mazanie tu nie je povolené.');hint.push(['Príkaz rm maže bez Koša – na skutočnom PC s ním opatrne!','Az rm parancs Lomtár nélkül töröl – valódi gépen óvatosan!'])}
  else if(c==='sudo'){out.push(LI?'(Szimuláció) A sudo rendszergazdai jelszót kér – itt nem használható.':'(Simulácia) sudo pýta heslo správcu – tu sa nepoužíva.');hint.push(['sudo spustí príkaz s právami správcu (root). Používa sa napr. pri inštalácii: sudo apt install …','A sudo rendszergazdai (root) jogokkal futtat egy parancsot. Például telepítéskor használják: sudo apt install …'])}
  else{out.push(`${c}: command not found`)}
  if(c!=='clear'){const last=s.log[s.log.length-1];last.o=out.join('\n');last.h=hint}
  if(s.log.length>40)s.log=s.log.slice(-40);
  const n=TGOALS.filter(g=>s.g[g.id]).length;
  if(n===TGOALS.length&&!S.pts.term){award('term',5);finish('term')}
  save();
}

  <h3>Priebeh (25 min)</h3><div class="tblw"><table><tr><th>Čas</th><th>Šanón</th><th>Čo robia žiaci</th></tr>
   <tr><td>0 – 5</td><td>1 Čo je Linux</td><td>jadro × distribúcia, vrstvy, open source; tip do obálky (TOP500); triedenie 8 položiek; PL 1</td></tr>
   <tr><td>5 – 10</td><td>2 Distribúcie</td><td>rodiny Debian/Fedora/Arch, LTS; otvorenie obálky; poradňa (5 situácií); spájanie pojmov; PL 2</td></tr>
   <tr><td>10 – 15</td><td>3 Prostredie</td><td>popis očíslovanej plochy Ubuntu (6 častí), slovník Windows → Linux, cesty; PL 3</td></tr>
   <tr><td>15 – 22</td><td>4 Test</td><td>8 otázok, meno, stiahnutie výsledku (.json) – ešte pred hrou, osvedčenie</td></tr>
   <tr><td>22 – 25</td><td>5 Mini hra</td><td>Linuxový triedič (45 s, odomkne sa po teste, do známky sa nepočíta)</td></tr>
   <tr><td>rýchli / doma</td><td>6 – 7 bonus</td><td>simulovaný terminál (5 krokov), pravda/mýtus o Linuxe</td></tr></table></div>
  <h3>Čo povedať pri výklade</h3><ul>
   <li><b>Šanón 1:</b> Linux = motor auta (jadro). Distribúcia = celé auto: karoséria (prostredie), výbava (aplikácie), servisná knižka (aktualizácie). Linus Torvalds 1991, GPL: kód je verejný a úpravy musia ostať verejné. Linux je všade – Android, servery, všetkých 500 superpočítačov TOP500 – len na desktopoch je menšinový (StatCounter 2026: zhruba 4 – 7 %, čísla kolíšu).</li>
   <li><b>Šanón 2:</b> distribúcie tvoria rodokmeň: Debian → Ubuntu → Mint. Výber podľa používateľa: začiatočník z Windows → Mint, server → Debian/Ubuntu LTS, najnovší softvér → Fedora, slabé PC → ľahké prostredie (Lubuntu, Xfce). LTS = 5 rokov aktualizácií (Ubuntu 26.04 do 4/2031). Programy z repozitára, nie zo stránok s .exe. Vyskúšať sa dá z live USB.</li>
   <li><b>Šanón 3:</b> ukážte plochu GNOME: horná lišta (vľavo prehľad aktivít/plochy, v strede čas a upozornenia, vpravo systémová ponuka), vľavo dok, dole v doku mriežka aplikácií, kláves Super. Mint/KDE vyzerajú ako Windows. Cesty: žiadne C:, koreň /, domov /home/meno, lomka /, Foto.jpg ≠ foto.jpg, skryté súbory s bodkou.</li></ul>
  <h3>5-minútová rozcvička na začiatok ďalšej hodiny</h3><ol>
   <li>Linux v užšom zmysle je… (jadro OS) a distribúcia je… (jadro + nástroje + prostredie + aplikácie)</li>
   <li>Vymenujte dve distribúcie z rodiny Debian. (Ubuntu, Linux Mint, Kubuntu…)</li>
   <li>Čo znamená LTS a dokedy má podporu Ubuntu 26.04? (dlhodobá podpora, do apríla 2031)</li>
   <li>Prepíšte cestu C:\\Users\\Lilla\\Dokumenty do Linuxu. (/home/lilla/Dokumenty)</li>
   <li>Ktorým klávesom otvoríte v GNOME prehľad aktivít? (Super / kláves Windows)</li></ol>
   <p class="note">Bonus na 1 min: kto má Android, nájde v telefóne verziu jadra Linux (domáca úloha).</p>
  <h3>Hodnotenie a pracovný list</h3>
  <p><b>Stránka:</b> test 40 % (prvý pokus, 8 otázok) + úlohy povinných šanónov 1 – 3 40 % (body na prvý pokus, spolu 32 b.) + aktívny čas 20 % (15 min = 100 %). Mini hra a bonusy sa nepočítajú.<br>
  <b>Stupnica INF:</b> výborný 100 – 90 %, chválitebný 89 – 75 %, dobrý 74 – 50 %, dostatočný 49 – 25 %, nedostatočný 24 – 0 %.<br>
  <b>Pracovný list:</b> 20 b. (1: 6 b., 2: 6 b., 3: 8 b.), stupnica 20 – 18 / 17 – 15 / 14 – 10 / 9 – 5 / 4 – 0 b. Kľúč je v samostatnom súbore.</p>
  <h3>Výsledky triedy</h3>
  <p>Načítajte súbory <code>.json</code>, ktoré žiaci stiahli v šanóne 4 (naraz aj viac).${INFRAME?' <span class="warn-t">V tomto náhľade (artifact) súbory načítate, ale export CSV sa stiahnuť nedá – na export otvorte žiacky súbor s adresou končiacou #ucitel.</span>':''}</p>
  <div class="row"><input type="file" id="tpFiles" accept=".json,application/json" multiple><button class="btn small" data-a="tp:csv" ${CLASS.length?'':'aria-disabled="true"'}>${ic('download')}Export CSV (Excel)</button><button class="btn small ghost" data-a="tp:clear" ${CLASS.length?'':'aria-disabled="true"'}>Vyprázdniť tabuľku</button></div>
  ${CLASS.length?`<div class="tblw"><table><tr><th>Meno</th><th>Trieda</th><th>Aktívny čas</th><th>Šanóny</th><th>Úlohy</th><th>Test</th><th>Čas</th><th>Spolu</th><th>Známka</th><th>Kontrola</th></tr>${rows}</table></div>`:'<p class="note">Zatiaľ nič nenačítané.</p>'}
  <h3>Tipy</h3><ul>
   <li><b>Žiacky súbor</b> nemá tlačidlo Pre učiteľa. Panel otvoríte <b>piatimi rýchlymi kliknutiami na logo</b> vľavo hore alebo adresou končiacou <code>#ucitel</code>.</li>
   <li><b>Aktívny čas</b> sa počíta len vtedy, keď je stránka viditeľná, okno má fokus a žiak za poslednú minútu klikol, písal alebo posúval.</li>
   <li>Postup sa ukladá len v prehliadači. Na spoločných počítačoch ho medzi triedami vymažte (nižšie) alebo nech žiaci pracujú v súkromnom okne.</li>
   <li>Ak máte možnosť, ukážte na projektore Ubuntu alebo Mint z live USB či vo virtuálnom počítači – žiaci Linux na školských PC nemajú. Obrázok plochy v hodine je zjednodušená ilustrácia, nie snímka obrazovky.</li>
   <li><b>Maďarské termíny na kontrolu:</b> „rendszermag (kernel)“, „disztribúció“ (v zadaní bolo „terjesztés“ – to je skôr všeobecné „šírenie“, pre Linux sa používa „disztribúció“), „asztali környezet“, „csomagkezelő“, „tároló (repozitár)“, „gyökérkönyvtár“, „saját mappa“. Popisy prvkov GNOME („Tevékenységek“, „Fájlok“, „Beállítások“) sa môžu líšiť podľa verzie prekladu – overte v systéme.</li>
   <li>Názvy verzií a dátumy sú k novembru 2026. Linux Mint 27 je ohlásený na Vianoce 2026 – po vydaní ho môžete doplniť.</li>
   <li>Maďarské názvy známok sú podľa slovenskej stupnice: jeles (1), dicséretes (2), jó (3), elégséges (4), elégtelen (5).</li></ul>
  <h3>Režim tabule a vymazanie postupu</h3>
  <div class="row"><button class="btn small ghost" data-a="tp:board">${document.documentElement.classList.contains('board')?'Vypnúť':'Zapnúť'} režim tabule (väčšie písmo)</button>
   <button class="btn small ${resetArm?'':'ghost'}" data-a="tp:reset">${resetArm?'Naozaj vymazať? Kliknite znova':'Vymazať postup v tomto prehliadači'}</button></div>
  <h3>Zdroje (overené november 2026)</h3><ul>${SRC.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('')}</ul>
  <p class="note">${esc(T.author[0])}</p></div>`;
}
function openTeacher(){const d=$('#tdlg');d.innerHTML=teacherHTML();if(!d.open){try{d.showModal()}catch(e){d.setAttribute('open','')}}}
function onTeacher(v){
  if(v==='close'){$('#tdlg').close();return}
  if(v==='board'){document.documentElement.classList.toggle('board');openTeacher();requestAnimationFrame(afterRender);return}
  if(v==='reset'){if(!resetArm){resetArm=1;openTeacher();setTimeout(()=>{if(resetArm){resetArm=0;if($('#tdlg').open)openTeacher()}},5000);return}
    resetArm=0;store.del(SKEY);S=S0();GM.run=false;GM.res=null;clearInterval(GM.iv);renderAll();openTeacher();toast('Postup vymazaný.');return}
  if(v==='clear'){CLASS=[];openTeacher();return}
  if(v==='csv'){const h=['Meno','Trieda','Dátum','Aktívny čas (min)','Hotové šanóny','Úlohy %','Body úloh','Test (z 8)','Čas %','Spolu %','Známka','Kontrola'];
    const lines=[h].concat(CLASS.map(c=>[c.name,c.cls,c.date,(c.active/60).toFixed(1).replace('.',','),(c.secs||[]).length,c.tasks,c.tasksPts,c.test??'',c.time,c.total,c.grade,c.chk]))
      .map(r=>r.map(x=>{x=String(x??'');return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(';'));
    dlFile('vysledky_linux-distribucie.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8');return}
}
document.addEventListener('change',e=>{
  if(e.target.id!=='tpFiles')return;const fs=[...e.target.files];let left=fs.length;
  fs.forEach(f=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);let chk='OK';
      if(o.lesson!==LID)chk='iná hodina';else if(signRes(o)!==o.code)chk='upravený';
      o.chk=chk;CLASS=CLASS.filter(c=>!(c.name===o.name&&c.cls===o.cls&&c.code===o.code));CLASS.push(o)}catch(err){CLASS.push({name:f.name,cls:'',chk:'chybný súbor'})}
      if(--left===0){CLASS.sort((a,b)=>String(a.name).localeCompare(String(b.name),'sk'));openTeacher()}};r.readAsText(f)});
});
/* Enter/medzerník na prvkoch s data-a, ktoré nie sú tlačidlá */
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-a]:not(button):not(a)')){e.preventDefault();e.target.click()}});
function checkHash(){if(false){showTeacher=true;renderTop();openTeacher()}}
window.addEventListener('hashchange',checkHash);

/* ---------- init ---------- */
(function init(){
  load();
  const l=store.get(LKEY);if(l==='0'||l==='1')LI=+l;document.documentElement.lang=LI?'hu':'sk';
  const th=store.get(THKEY);if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;
  renderAll();checkHash();
  window.addEventListener('beforeunload',()=>store.set(SKEY,JSON.stringify(S)));
})();
