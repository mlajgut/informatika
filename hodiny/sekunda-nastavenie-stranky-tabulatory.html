/* ---------- class results ---------- */
let IMP=[],IMPMSG='';
function verify(o){
  if(!o||typeof o!=='object') return 'chyba';
  if(o.lesson!==LESSON.id) return 'iná hodina';
  const c=o.check,copy=Object.assign({},o);delete copy.check;
  return checkOf(copy)===c?'OK':'upravený';
}
function impTable(){
  if(!IMP.length) return `<p class="small">Zatiaľ nič. Vyberte naraz všetky súbory <span class="mono">.json</span> od žiakov.</p>`;
  const rows=IMP.slice().sort((a,b)=>String(a.o.cls).localeCompare(b.o.cls,'sk')||String(a.o.name).localeCompare(b.o.name,'sk'));
  return `<div class="ptwrap"><table class="ptbl imp"><thead><tr><th>Meno</th><th>Trieda</th><th>Aktívny čas</th><th>Šanóny</th><th>Úlohy</th><th>Test</th><th>Čas odovzdania</th><th>Spolu</th><th>Známka</th><th>Kontrola</th></tr></thead><tbody>`+
    rows.map(({o,st})=>{const f=Array.isArray(o.folders)?o.folders:[],req=f.filter(x=>REQ.includes(x.id)).length;
      return `<tr><td>${esc(o.name)}</td><td>${esc(o.cls)}</td><td>${minTxt(o.active_s)}</td><td>${req}/${REQ.length}${f.length>req?` +${f.length-req}`:''}</td><td>${o.tasks?o.tasks.pct:'–'} %</td><td>${o.test?`${o.test.first??'–'}/${o.test.n}`:'–'}</td><td>${o.date?esc(new Date(o.date).toLocaleString('sk-SK',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})):'–'}</td><td><b>${o.total_pct??'–'} %</b></td><td><b>${o.grade??'–'}</b></td><td class="${st==='OK'?'okc':'badc'}">${st}</td></tr>`}).join('')+`</tbody></table></div>`;
}
CH.imp=el=>{
  const files=[...(el.files||[])];if(!files.length) return;IMPMSG='';
  let left=files.length,bad=0;
  files.forEach(f=>{const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result);const st=verify(o);const key=x=>[x.name,x.cls,x.date,x.lesson,x.check].join('|');IMP=IMP.filter(x=>key(x.o)!==key(o));IMP.push({o,st,file:f.name})}catch(e){bad++}
      if(--left===0){IMPMSG=`Načítané: ${files.length-bad}${bad?` · nečitateľné: ${bad}`:''}`;teacherPaint()}};
    rd.onerror=()=>{bad++;if(--left===0){IMPMSG=`Nečitateľné súbory: ${bad}`;teacherPaint()}};
    rd.readAsText(f)});
};
A.impClear=()=>{IMP=[];IMPMSG='';teacherPaint()};
A.csv=()=>{
  if(!IMP.length) return;
  if(INFRAME){IMPMSG='V tomto náhľade sa sťahovať nedá – otvorte žiacky súbor s #ucitel.';teacherPaint();return}
  const q=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const head=['Meno','Trieda','Aktívny čas (min)','Povinné šanóny','Úlohy %','Test body','Test z','Test %','Spolu %','Známka','Odovzdané','Kontrola'];
  const lines=IMP.map(({o,st})=>{const f=Array.isArray(o.folders)?o.folders:[];
    return [o.name,o.cls,fmt((o.active_s||0)/60,1),f.filter(x=>REQ.includes(x.id)).length+'/'+REQ.length,o.tasks?o.tasks.pct:'',o.test?o.test.first:'',o.test?o.test.n:'',o.test?o.test.pct:'',o.total_pct,o.grade,o.date?new Date(o.date).toLocaleString('sk-SK'):'',st].map(q).join(';')});
  downloadText(`${LESSON.id}_vysledky.csv`,'﻿'+[head.join(';'),...lines].join('\r\n'),'text/csv;charset=utf-8');
};
let RESETQ=false;
function renderTeacher(){
  return `<div class="tdlg-h"><h2 id="tdlgT">${ico('cap')} Pre učiteľa</h2><button class="iconbtn sq" data-a="tdclose" aria-label="${t('close')}">${ico('x')}</button></div><div class="tdlg-b">`+
    `<section><h3>Ciele hodiny</h3><ul>${H.goals.map(g=>`<li>${g}</li>`).join('')}</ul></section>`+
    `<section><h3>Súvis s obsahovým a výkonovým štandardom</h3><ul>${TD.std.map(x=>`<li>${x}</li>`).join('')}</ul></section>`+
    `<section><h3>Priebeh hodiny (25 min)</h3><div class="ptwrap"><table class="ptbl"><thead><tr><th>Čas</th><th>Šanón</th><th>Čo robíme</th></tr></thead><tbody>${TD.plan.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]} · ${esc(SECS[+p[1]-1].tab)}</td><td>${p[2]}</td></tr>`).join('')}</tbody></table></div><p class="small mt">${TD.bonus}</p></section>`+
    `<section><h3>Čo povedať pri výklade</h3><ul>${TD.talk.map(x=>`<li><b>${x[0]}:</b> ${x[1]}</li>`).join('')}</ul></section>`+
    `<section><h3>Rozcvička na začiatok ďalšej hodiny (5 min)</h3><ol class="tol">${TD.warm.map(x=>`<li>${x}</li>`).join('')}</ol></section>`+
    `<section><h3>Hodnotenie a pracovný list</h3><ul><li><b>Známka zo stránky:</b> test 40 % (prvý pokus) + úlohy v šanónoch 1 – 3 40 % (${TASKMAX} b, prvý pokus) + aktívny čas 20 % (100 % = 15 min).</li>`+
      `<li><b>Stupnica:</b> výborný 100 – 90 %, chválitebný 89 – 75 %, dobrý 74 – 50 %, dostatočný 49 – 25 %, nedostatočný 24 – 0 %.</li>`+
      `<li><b>Pracovný list (20 b):</b> 1 = 18 – 20 b, 2 = 15 – 17 b, 3 = 10 – 14 b, 4 = 5 – 9 b, 5 = 0 – 4 b. Riešenia sú v kľúči.</li>`+
      `<li>Mini hra a bonusové šanóny dávajú len XP, do známky sa nepočítajú.</li></ul></section>`+
    `<section><h3>Výsledky triedy</h3><p class="small">Načítajte súbory, ktoré žiaci stiahli v šanóne 4. Kontrola „OK“ znamená, že súbor nikto neupravoval; „upravený“ – údaje v súbore boli zmenené; „iná hodina“ – súbor je z inej hodiny.</p>`+
      (INFRAME?`<p class="small">${ico('info')} V tomto náhľade sa súbory sťahovať nedajú – na spracovanie výsledkov otvorte žiacky súbor s adresou končiacou <span class="mono">#ucitel</span>.</p>`:'')+
      `<div class="row mt"><label class="btn sky sm filebtn">${ico('upload')} Načítať súbory .json<input type="file" accept=".json,application/json" multiple data-ch="imp"></label>`+
      `<button class="btn ghost sm" data-a="csv"${IMP.length?'':' disabled'}>${ico('download')} Export CSV pre Excel</button>${IMP.length?`<button class="btn ghost sm" data-a="impClear">${ico('x')} Vyčistiť</button>`:''}</div>`+
      (IMPMSG?`<p class="small mt">${esc(IMPMSG)}</p>`:'')+`<div class="mt">${impTable()}</div></section>`+
    `<section><h3>Tipy</h3><ul>${TD.tips.map(x=>`<li>${x}</li>`).join('')}</ul></section>`+
    `<section><label class="row" style="cursor:pointer"><input type="checkbox" data-ch="board" ${document.documentElement.classList.contains('board')?'checked':''} style="width:20px;height:20px;accent-color:var(--mint)"> <b>${ico('board')} Režim tabule – väčšie písmo pre projektor</b></label></section>`+
    `<section><h3>Nový žiak na tomto zariadení</h3>${RESETQ?`<div class="fb warn"><p><b>Naozaj? Zmažú sa XP, odpovede, aktívny čas aj meno.</b></p><div class="row mt"><button class="btn coral sm" data-a="tresetYes">${ico('reset')} Áno, vymazať</button><button class="btn ghost sm" data-a="tresetNo">Nie</button></div></div>`:`<button class="btn ghost sm" data-a="treset">${ico('reset')} Vymazať postup na tomto zariadení</button>`}</section>`+
    `<section><h3>Zdroje faktov (november 2026)</h3><ul>${TD.src.map(s=>`<li><a href="${s[0]}" target="_blank" rel="noopener noreferrer">${s[1]}</a></li>`).join('')}</ul></section>`+
    `<p class="small">${esc(AUTHOR)}</p></div>`;
}
function teacherPaint(){const d=$('#tdlg'),f=grabFocus(d);d.innerHTML=renderTeacher();putFocus(d,f)}
A.teacher=()=>{const d=$('#tdlg');RESETQ=false;d.innerHTML=renderTeacher();
  if(typeof d.showModal==='function'){try{d.showModal()}catch(e){d.setAttribute('open','')}}else d.setAttribute('open','');
  const c=d.querySelector('[data-a="tdclose"]');if(c) c.focus({preventScroll:true})};
A.tdclose=()=>{const d=$('#tdlg');try{d.close()}catch(e){d.removeAttribute('open')}};
A.treset=()=>{RESETQ=true;teacherPaint();const b=$('#tdlg [data-a="tresetNo"]');if(b) b.focus({preventScroll:true})};
A.tresetNo=()=>{RESETQ=false;teacherPaint()};
A.tresetYes=()=>{store.del(KEY);S=S0();RESETQ=false;resetTransient();renderAll();teacherPaint();toast(`${ico('reset')} Postup bol vymazaný.`,2200)};
CH.board=el=>{document.documentElement.classList.toggle('board',el.checked);store.set('inf-board',el.checked?'1':'0');setPad()};
function resetTransient(){
  PGOPEN=null;PMFB=null;SSEL=null;SFB=null;LOPEN=null;
  clearInterval(GM.iv);Object.assign(GM,{run:false,end:0,score:0,streak:0,miss:0,cur:-1,last:-1,iv:0,fb:null,res:null});
  JUST=null;
}
function init(){
  const th=store.get('inf-theme');if(th==='dark'||th==='light') document.documentElement.dataset.theme=th;
  if(store.get('inf-board')==='1') document.documentElement.classList.add('board');
  loadState();
  document.title=LESSON.title;
  renderAll();
  addEventListener('resize',setPad);
  try{new ResizeObserver(()=>setPad()).observe($('#top'))}catch(e){}
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme) renderTop()})}catch(e){}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(setPad);
  $('#tdlg').addEventListener('click',e=>{if(e.target.id==='tdlg') A.tdclose()});
  addEventListener('hashchange',()=>{renderTop();setPad();if(false&&STUDENT) A.teacher()});
  if(STUDENT&&false) setTimeout(A.teacher,80);
  setInterval(()=>{const r=$('#resTbl');if(r) r.innerHTML=resTable(results())},5000);
  const h=location.hash.slice(1);if(h&&h!=='ucitel'&&/^[\w-]+$/.test(h)&&document.getElementById(h)) setTimeout(()=>document.getElementById(h).scrollIntoView(),60);
}
init();
