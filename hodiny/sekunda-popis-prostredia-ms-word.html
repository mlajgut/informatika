<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Popis prostredia MS Word</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: an office desk — every mission level is a file folder with a tab, activities sit inside it as sheets;
   document-type colours (text / sheet / slides) and suite colours (Microsoft / LibreOffice) carry meaning everywhere */
:root{
  --desk:#EDF1FA;--paper:#FFFFFF;--paper2:#F5F7FD;--ink:#1E1B3A;--muted:#55527A;--line:#1E1B3A;--hair:#D2D8EC;--soft:#E3E8FA;--shadow:#1E1B3A;
  --doc:#2B5FD9;--sheet:#0F8A45;--slide:#D9561A;--db:#7E47DB;--draw:#A87A00;--math:#C42F6B;
  --ms:#3B4CCB;--lo:#0B8572;--on-suite:#FFFFFF;
  --sun:#FFC93C;--mint:#2EC4B6;--coral:#FF8A80;--sky:#62D2F3;--lilac:#CDAEF7;--peach:#FFB98F;--lime:#C3E670;--rose:#F8AED3;
  --on-bright:#1E1B3A;
  --ok:#11743C;--okbg:#DCF2E4;--bad:#BF2830;--badbg:#FBE3E3;--warn:#8A5700;--warnbg:#FFF0C9;--stamp:#C3233F;
  --go:#2BB673;--stop:#E5484D;
  --fh:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --fb:"Nunito","Segoe UI",system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#13122A;--paper:#1E1C3F;--paper2:#191838;--ink:#F0EEFF;--muted:#B6B2DE;--line:#8D86D6;--hair:#35325F;--soft:#2A2756;--shadow:#06050F;
  --doc:#8AABFF;--sheet:#5BD893;--slide:#FFA06C;--db:#BC9BFF;--draw:#F2CB55;--math:#FF8AB8;
  --ms:#909CFF;--lo:#47D4BB;--on-suite:#12102A;
  --ok:#62DE9B;--okbg:#163A29;--bad:#FF8E8E;--badbg:#47192A;--warn:#FFCB6B;--warnbg:#3D2E12;--stamp:#FF7590;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#13122A;--paper:#1E1C3F;--paper2:#191838;--ink:#F0EEFF;--muted:#B6B2DE;--line:#8D86D6;--hair:#35325F;--soft:#2A2756;--shadow:#06050F;
  --doc:#8AABFF;--sheet:#5BD893;--slide:#FFA06C;--db:#BC9BFF;--draw:#F2CB55;--math:#FF8AB8;
  --ms:#909CFF;--lo:#47D4BB;--on-suite:#12102A;
  --ok:#62DE9B;--okbg:#163A29;--bad:#FF8E8E;--badbg:#47192A;--warn:#FFCB6B;--warnbg:#3D2E12;--stamp:#FF7590;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{font-size:17px;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 128px)}
html.board{font-size:20px}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--fb);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.15;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:8px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--fm);font-size:.92em}
kbd{font-family:var(--fh);font-weight:600;font-size:.92em;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:7px;padding:0 .45em;white-space:nowrap}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--paper);border-bottom:3px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:9px 6px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;text-decoration:none}
.brand svg{width:40px;height:40px;flex:none}
.brand b{display:block;font-family:var(--fh);font-weight:700;font-size:1.06rem;line-height:1.1}
.brand small{display:block;font-size:.76rem;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.xp{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:4px 10px 4px 6px;background:var(--paper2);font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums}
.xp-rank{font-family:var(--fh);font-weight:600;background:var(--sun);color:var(--on-bright);border-radius:8px;padding:1px 8px;white-space:nowrap}
.xp-num b{font-family:var(--fh);font-size:1.05rem}
.xp-bar{width:64px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--hair)}
.xp-bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .5s}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:5px 11px;font-weight:800;font-size:.85rem;letter-spacing:.04em}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;font-weight:800;font-size:.85rem;min-height:36px}
.iconbtn.sq{width:38px;justify-content:center;padding:0}
.path{display:flex;gap:6px;overflow-x:auto;padding-block:2px 9px;scrollbar-width:thin}
.path a{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;font-weight:800;font-size:.82rem;padding:3px 10px 3px 3px;border:2px solid var(--line);border-radius:10px;background:var(--paper)}
.path a .n{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--c);color:var(--on-bright);font-family:var(--fh);font-weight:600;font-size:.82rem}
.path a.done{background:color-mix(in srgb,var(--ok) 12%,var(--paper));border-color:var(--ok)}
.path a.done .n{background:var(--ok);color:var(--paper)}

/* ---------- hero ---------- */
main{padding-block:26px 40px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:center}
.kicker{display:inline-block;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hero h1{font-weight:700;font-size:clamp(2.3rem,6.2vw,3.9rem);letter-spacing:-.02em}
.hero .h1b{display:block;font-size:.5em;font-weight:600;letter-spacing:0;margin-top:6px}
.hero .h1b .ms{color:var(--ms)}.hero .h1b .lo{color:var(--lo)}
.story{font-size:1.08rem;max-width:62ch;margin-top:14px}
.hero-art{width:100%;max-width:440px;height:auto;justify-self:center;overflow:visible}
.ha-shadow{fill:var(--hair)}
.ha-paper{fill:var(--paper);stroke:var(--line);stroke-width:3.5}
.ha-line{stroke:var(--hair);stroke-width:5;stroke-linecap:round}
.ha-case{fill:color-mix(in srgb,var(--ms) 72%,var(--lo));stroke:var(--line);stroke-width:4}
.ha-strap{fill:var(--sun);stroke:var(--line);stroke-width:3}
.ha-clasp{fill:var(--paper);stroke:var(--line);stroke-width:3}
.ha-handle{fill:none;stroke:var(--line);stroke-width:9;stroke-linecap:round}
.ha-tag{stroke:var(--line);stroke-width:3}
.ha-tag.ms{fill:var(--ms)}.ha-tag.lo{fill:var(--lo)}
.ha-tagt{fill:var(--on-suite);font:700 15px var(--fm)}
.ha-spark{fill:var(--sun);stroke:var(--line);stroke-width:2}
.ha-float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ha-float.f2{animation-delay:-1.6s}.ha-float.f3{animation-delay:-3.2s}
@keyframes float{50%{transform:translateY(-9px)}}
.team-h{font-family:var(--fh);font-weight:600;font-size:1.05rem;margin:22px 0 10px}
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.member{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);border-radius:14px;background:var(--paper);padding:10px 6px 9px;text-align:center}
.member .ava{width:58px;height:58px}
.member b{font-family:var(--fh);font-weight:600;font-size:1.02rem}
.member small{font-size:.76rem;font-weight:800;color:var(--muted);line-height:1.2}
.member[aria-pressed="true"]{background:color-mix(in srgb,var(--sun) 28%,var(--paper));box-shadow:3px 3px 0 var(--shadow)}
.bubble{margin-top:12px;border:2px solid var(--line);border-radius:16px;background:var(--paper);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;position:relative}
.bubble .ava{width:46px;height:46px;flex:none}
.bubble q{font-family:var(--fh);font-weight:500;font-size:1.1rem;quotes:"„" "“"}
.bubble .go{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:800;font-size:.86rem;color:var(--muted);text-decoration:none;border-bottom:2px dotted var(--hair)}
.goals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:26px}
.panel{border:2px solid var(--line);border-radius:18px;background:var(--paper);padding:16px 18px}
.panel h3{font-size:1.15rem;margin-bottom:8px}
.goals ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.plan{display:flex;flex-wrap:wrap;gap:6px}
.plan a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:2px solid var(--line);border-radius:10px;padding:3px 9px 3px 3px;font-weight:800;font-size:.84rem;background:var(--paper)}
.plan a .n{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--c);color:var(--on-bright);font-family:var(--fh)}
.plan a em{font-style:normal;color:var(--muted);font-weight:700}
.plan-note{font-size:.86rem;color:var(--muted);margin-top:8px}

/* ---------- section folders ---------- */
.lvl{position:relative;margin-top:62px;background:var(--paper);border:3px solid var(--line);border-radius:0 22px 22px 22px;box-shadow:7px 7px 0 var(--shadow);padding:22px 24px 26px}
.lvl-tab{position:absolute;left:-3px;bottom:100%;display:flex;align-items:center;gap:9px;background:var(--c);color:var(--on-bright);border:3px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:5px 16px 4px 6px;font-family:var(--fh);font-weight:600;font-size:1rem}
.lvl-tab .n{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--paper);color:var(--ink);border:2px solid var(--line);font-weight:700}
.stamp{position:absolute;right:20px;top:-26px;transform:rotate(-7deg);border:3px solid var(--stamp);color:var(--stamp);background:color-mix(in srgb,var(--paper) 88%,transparent);font-family:var(--fh);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:1rem;padding:2px 12px;border-radius:9px;pointer-events:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--stamp) 25%,transparent)}
.stamp.new{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:rotate(-7deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:rotate(-7deg) scale(1)}}
.lvl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 18px;flex-wrap:wrap}
.lvl-ttl{min-width:0;flex:1 1 420px}
.lvl-head h2{font-size:clamp(1.5rem,3.4vw,2.05rem);font-weight:600}
.lead{color:var(--muted);max-width:70ch;margin-top:8px;font-size:1.02rem}
.tchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper2);border-radius:10px;padding:4px 10px;font-weight:800;font-size:.85rem}
.tchip em{font-style:normal;background:var(--c);color:var(--on-bright);border-radius:6px;padding:0 6px;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em}
.tchip:hover{background:var(--soft)}

/* activities inside a folder */
.act{border-top:2px dashed var(--hair);padding-top:20px;margin-top:22px}
.act-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
.act-h h3{font-size:1.24rem}
.kind{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.how{color:var(--muted);font-size:.94rem;margin:0 0 12px;max-width:75ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mt{margin-top:14px}
.small{font-size:.88rem;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--fh);font-weight:600;font-size:1rem;border:3px solid var(--line);border-radius:12px;padding:7px 16px;background:var(--sun);color:var(--on-bright);box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){filter:brightness(1.04)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.mint{background:var(--mint)}.btn.sky{background:var(--sky)}.btn.coral{background:var(--coral)}
.btn.sm{font-size:.9rem;padding:4px 11px;border-width:2px;box-shadow:2px 2px 0 var(--shadow)}
.btn:disabled{opacity:.45}
.linkbtn{border:0;background:none;padding:0;font-weight:800;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px}

/* choices */
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 13px;font-weight:700;color:var(--ink);transition:transform .1s,background .1s}
.opt:hover:not(:disabled){background:var(--paper2);transform:translateX(2px)}
.opt .mk{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);font-family:var(--fh);font-weight:600;font-size:.85rem;background:var(--paper2)}
.opt.pick{background:color-mix(in srgb,var(--sun) 32%,var(--paper))}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .mk{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.no{background:var(--badbg);border-color:var(--bad)}
.opt.no .mk{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.warn{background:var(--warnbg);border-color:var(--warn)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no):not(.pick):not(.warn){opacity:.6}
.fb{margin-top:12px;padding:10px 14px;border-radius:12px;border:2px solid var(--hair);background:var(--paper2);font-weight:600;max-width:80ch}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.no{border-color:var(--bad);background:var(--badbg)}
.fb.warn{border-color:var(--warn);background:var(--warnbg)}
.fb b,.fb strong{font-family:var(--fh);font-weight:600}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}

/* chips (things to sort) */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:5px 12px 5px 5px;font-weight:800;color:var(--ink);font-size:.95rem;text-align:left}
.chip .ic{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:color-mix(in srgb,var(--tc,var(--muted)) 16%,var(--paper));color:var(--tc,var(--muted))}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--sun) 35%,var(--paper));box-shadow:3px 3px 0 var(--shadow);transform:translate(-1px,-1px)}
.chip.placed{border-color:var(--ok);cursor:default}
.chip.file{font-family:var(--fm);font-size:.95rem;padding:6px 12px}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.zone{display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:left;border:3px dashed var(--zc,var(--line));border-radius:16px;padding:12px;min-height:130px;background:color-mix(in srgb,var(--zc,var(--soft)) 7%,var(--paper));color:var(--ink)}
.zone.armed{border-style:solid;box-shadow:0 0 0 4px color-mix(in srgb,var(--zc,var(--sun)) 25%,transparent)}
.zone h4{display:flex;align-items:center;gap:8px;font-size:1.05rem}
.zone h4 small{font-family:var(--fb);font-weight:700;font-size:.8rem;color:var(--muted)}
.zone .in{display:flex;flex-wrap:wrap;gap:6px}
.zone .in .chip{font-size:.85rem;padding:3px 10px 3px 3px}
.zone .in .chip .ic{width:24px;height:24px}

/* ---------- section 1 ---------- */
.email{border:2px solid var(--line);border-radius:16px;background:var(--paper2);overflow:hidden;max-width:620px}
.email-h{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 16px;border-bottom:2px solid var(--hair);font-size:.92rem}
.email-h b{color:var(--muted);font-weight:800}
.email-b{padding:12px 16px}
.att{display:inline-flex;align-items:center;gap:10px;margin-top:10px;border:2px solid var(--line);border-radius:12px;padding:6px 12px 6px 6px;background:var(--paper);font-family:var(--fm);font-weight:700}
.att .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:color-mix(in srgb,var(--lo) 16%,var(--paper));color:var(--lo)}
.att small{font-family:var(--fb);color:var(--muted);font-weight:700}
.lock{display:inline-flex;align-items:center;gap:6px}

/* ---------- section 2 ---------- */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.flip{border:0;background:none;padding:0;perspective:900px;text-align:left;min-height:200px;color:var(--ink)}
.flip-in{position:relative;display:block;width:100%;height:100%;min-height:200px;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip[aria-pressed="true"] .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border:3px solid var(--line);border-radius:16px;background:var(--paper);padding:14px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.face.front{align-items:center;justify-content:center;text-align:center;background:color-mix(in srgb,var(--tc) 10%,var(--paper))}
.face.front .big{display:grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--paper);border:3px solid var(--line);color:var(--tc)}
.face.front .big .i{width:34px;height:34px}
.face.front b{font-family:var(--fh);font-weight:600;font-size:1.2rem}
.face.front small{color:var(--muted);font-weight:700;font-size:.8rem}
.face.back{transform:rotateY(180deg)}
.fl-type{display:flex;align-items:center;gap:6px;font-family:var(--fh);font-weight:600;color:var(--tc)}
.fl-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;flex:1}
.fl-col{border-radius:10px;padding:6px 8px;background:var(--paper2);border:2px solid var(--hair);min-width:0}
.fl-col.ms{border-color:color-mix(in srgb,var(--ms) 55%,var(--hair))}.fl-col.lo{border-color:color-mix(in srgb,var(--lo) 55%,var(--hair))}
.fl-col small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fl-col b{display:block;font-family:var(--fh);font-weight:600;font-size:1rem;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.fl-col i{display:block;font-style:normal;font-family:var(--fm);font-size:.8rem;color:var(--muted)}
.fl-col em{display:block;font-style:normal;font-size:.72rem;color:var(--muted);line-height:1.25;margin-top:2px}
.fl-use{font-size:.82rem;font-weight:700}
.twins{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(36px,.55fr) minmax(0,1fr);align-items:start}
.tw-col{display:grid;gap:10px;position:relative;z-index:1}
.tw-col h4{font-size:.8rem;font-family:var(--fb);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tw-btn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:8px 10px;font-family:var(--fh);font-weight:600;font-size:1.02rem;text-align:left;color:var(--ink);min-width:0}
.tw-btn .ic{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;flex:none;background:color-mix(in srgb,var(--tc) 16%,var(--paper));color:var(--tc)}
.tw-btn.ms{border-left:6px solid var(--ms)}.tw-btn.lo{border-right:6px solid var(--lo)}
.tw-btn[aria-pressed="true"]{background:color-mix(in srgb,var(--sun) 35%,var(--paper));box-shadow:3px 3px 0 var(--shadow)}
.tw-btn.done{border-color:var(--tc);cursor:default}
.twins>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tw-line{fill:none;stroke-width:4;stroke-linecap:round}
.tasks{display:grid;gap:12px}
.trow{border:2px solid var(--hair);border-radius:14px;padding:10px 12px;background:var(--paper2)}
.trow.ok{border-color:var(--ok);background:var(--okbg)}
.trow p{font-weight:700}
.tbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;background:var(--paper);padding:4px 10px 4px 4px;font-weight:800;font-size:.86rem;color:var(--ink)}
.tbtn .ic{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:color-mix(in srgb,var(--tc) 16%,var(--paper));color:var(--tc)}
.tbtn.ok{background:var(--okbg);border-color:var(--ok)}.tbtn.no{background:var(--badbg);border-color:var(--bad)}
.tbtn:disabled{cursor:default}
.tfb{font-size:.9rem;font-weight:700;margin-top:6px}

/* ---------- section 3 ---------- */
.duel{display:grid;grid-template-columns:minmax(110px,.6fr) minmax(0,1fr) minmax(0,1fr);border:3px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}
.duel>div{padding:9px 12px;border-top:2px solid var(--hair);min-width:0}
.duel .dh{border-top:0;font-family:var(--fh);font-weight:600;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.duel .dh.ms{background:var(--ms);color:var(--on-suite)}.duel .dh.lo{background:var(--lo);color:var(--on-suite)}
.duel .dl{font-weight:800;font-size:.84rem;color:var(--muted);background:var(--paper2)}
.duel .dh.dl{background:var(--paper2)}
.duel .mono{font-weight:700}
.shared{margin-top:10px;font-weight:700}
.fact{display:flex;gap:12px;align-items:flex-start;margin-top:14px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--sun) 22%,var(--paper))}
.fact .i{width:26px;height:26px;margin-top:2px}
.hood{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hbox{border:3px solid var(--line);border-radius:16px;background:var(--paper2);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.hbox-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;font-family:var(--fh);font-weight:600;font-size:1.05rem;color:var(--on-suite)}
.hbox.ms .hbox-h{background:var(--ms)}.hbox.lo .hbox-h{background:var(--lo)}
.hbox-b{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.code{margin:0;font-family:var(--fm);font-size:.82rem;line-height:1.55;background:var(--desk);border:2px solid var(--hair);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--ink)}
.code .cm{color:var(--muted)}
.code .kw{color:var(--db);font-weight:700}
.binary{font-family:var(--fm);font-size:.8rem;line-height:1.35;color:var(--muted);background:var(--desk);border:2px solid var(--hair);border-radius:10px;padding:10px;overflow:hidden;word-break:break-all;height:6.4em;position:relative}
.binary::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--desk))}
.lockline{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--bad)}
.openline{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ok)}
.free{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.free div{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:color-mix(in srgb,var(--lo) 10%,var(--paper));font-size:.88rem;font-weight:700}
.free b{display:block;font-family:var(--fh);font-weight:600;font-size:1rem}
.sema{display:grid;gap:10px}
.smr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;border:2px solid var(--hair);border-radius:14px;padding:10px 12px;background:var(--paper2)}
.smr .who{display:flex;gap:10px;align-items:center;min-width:0}
.smr .who .ava{width:40px;height:40px;flex:none}
.smr p{font-weight:700}
.smr .bt{display:flex;gap:6px}
.smr .why{grid-column:1/-1;font-size:.92rem;font-weight:700}
.smr.ok{border-color:var(--ok);background:var(--okbg)}.smr.no{border-color:var(--bad);background:var(--badbg)}
.light{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:800;font-size:.88rem;background:var(--paper);color:var(--ink)}
.light::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--lc)}
.light.ok{--lc:var(--go)}.light.bad{--lc:var(--stop)}
.light.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 45%,transparent)}
.calc{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
.fields{display:grid;gap:10px}
.field{display:grid;gap:4px}
.field label{font-weight:800;font-size:.88rem}
.field .hint{font-size:.78rem;color:var(--muted);font-weight:700}
.field input[type=number],.field input[type=text]{width:100%;max-width:9.5rem;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--paper);font-weight:800;font-variant-numeric:tabular-nums}
.pricegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
input[type=range]{width:100%;accent-color:var(--mint)}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--paper2);width:36px;height:34px;font-weight:800;font-size:1.1rem}
.stepper output{min-width:42px;text-align:center;font-family:var(--fh);font-weight:600;font-size:1.1rem}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:end}
.bar .bn{font-weight:800;font-size:.9rem;min-width:0}
.bar .bn small{display:block;font-weight:700;color:var(--muted);font-size:.76rem}
.bar .bv{font-family:var(--fh);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums;text-align:right}
.bar .bt{grid-column:1/-1;height:16px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--hair)}
.bar .bt i{display:block;height:100%;border-radius:99px;background:var(--bc);transition:width .4s}
.bar.ms{--bc:var(--ms)}.bar.lo{--bc:var(--lo)}
.best{display:inline-block;margin-left:6px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--sun);color:var(--on-bright);border-radius:6px;padding:0 6px}
.qcard{border:2px solid var(--hair);border-radius:14px;padding:12px 14px;background:var(--paper2);margin-top:12px}
.qcard p.q{font-weight:800;margin-bottom:8px}
.ninput{width:6.5rem;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--paper);font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- section 4 ---------- */
.lab{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
.pickers{display:grid;gap:12px}
.pgrp h4{font-size:.78rem;font-family:var(--fb);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick{display:flex;align-items:center;gap:7px;border:2px solid var(--line);border-radius:10px;background:var(--paper);padding:5px 8px;font-weight:800;font-size:.86rem;text-align:left;min-width:0;color:var(--ink)}
.pick .ic{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;flex:none;background:color-mix(in srgb,var(--tc) 16%,var(--paper));color:var(--tc)}
.pick.f{font-family:var(--fm);font-size:.8rem;word-break:break-all}
.pick.ms{border-left:5px solid var(--ms)}.pick.lo{border-left:5px solid var(--lo)}
.pick[aria-pressed="true"]{background:color-mix(in srgb,var(--sun) 35%,var(--paper));box-shadow:2px 2px 0 var(--shadow)}
.tried{font-size:.86rem;font-weight:800;color:var(--muted)}
.win{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:5px 5px 0 var(--shadow)}
.win-bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 10px;border-bottom:3px solid var(--line);font-weight:800;font-size:.84rem;background:var(--wc,var(--soft));color:var(--on-suite);min-width:0}
.win-bar .t{flex:1 1 110px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--fm)}
.win-bar .dots{display:flex;gap:5px}
.win-bar .dots i{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--on-suite) 70%,transparent)}
.win.ms{--wc:var(--ms)}.win.lo{--wc:var(--lo)}
.win.idle .win-bar{color:var(--ink)}
.win-body{padding:14px;background:var(--desk);min-height:250px;position:relative}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:7px;padding:1px 8px;background:var(--paper);color:var(--ink)}
.status.native{background:var(--okbg);color:var(--ok)}.status.cross{background:var(--warnbg);color:var(--warn)}.status.err{background:var(--badbg);color:var(--bad)}
.pg{position:relative;background:var(--paper);border:2px solid var(--hair);border-radius:6px;padding:16px 18px;box-shadow:0 2px 0 var(--hair);color:var(--ink)}
.pg-h{font-family:var(--fh);font-weight:700;font-size:1.32rem;color:var(--doc);line-height:1.15}
.pg-row{display:flex;gap:14px;margin-top:10px;align-items:flex-start}
.pg-img{flex:none;width:96px;height:80px;border-radius:8px;background:var(--paper2);border:2px solid var(--hair);display:grid;place-items:center}
.pg-img svg{width:74px;height:64px}
.pg-txt{font-size:.88rem;min-width:0}
.pg-txt p+p{margin-top:5px}
.pg-when{font-weight:800}
.pg-sig{color:var(--muted);font-style:italic}
.pg.shift .pg-h{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:0;font-size:1.2rem}
.pg.shift .pg-row{flex-direction:row-reverse}
.pg.shift .pg-img{transform:translate(4px,16px) rotate(-3deg)}
.smk{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;background:var(--warnbg);color:var(--warn);border:2px dashed var(--warn);border-radius:8px;padding:0 6px;white-space:nowrap}
.smk.m1{top:-11px;left:12px}.smk.m2{bottom:-11px;right:12px}
.sheet{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums;background:var(--paper)}
.sheet th,.sheet td{border:1px solid var(--hair);padding:4px 6px;text-align:left;white-space:nowrap}
.sheet th{background:color-mix(in srgb,var(--sheet) 16%,var(--paper));font-weight:800}
.sheet .rn{width:22px;text-align:center;color:var(--muted);background:var(--paper2);font-weight:700}
.sheet td.num{text-align:right}
.sheet tr.tot td{font-weight:800;border-top:2px solid var(--sheet)}
.sheet.shift td.num.cut{letter-spacing:.08em;color:var(--bad)}
.tablewrap{overflow-x:auto;border:2px solid var(--hair);border-radius:6px;position:relative}
.slidebox{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--paper);border:2px solid var(--hair);border-radius:6px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:12px;align-items:center;overflow:visible}
.slidebox h5{grid-column:1/-1;margin:0;font-family:var(--fh);font-weight:700;font-size:1.25rem;color:var(--slide);align-self:start}
.slidebox ul{margin:0;padding-left:1.1em;font-size:.86rem;font-weight:700;display:grid;gap:3px}
.minichart{display:flex;align-items:flex-end;gap:6px;height:70px;border-bottom:2px solid var(--hair);padding:0 4px}
.minichart i{flex:1;background:var(--slide);border-radius:4px 4px 0 0}
.slidebox.shift h5{font-family:Georgia,"Times New Roman",serif;transform:translate(14px,6px)}
.errbox{display:flex;gap:12px;align-items:flex-start;border:3px solid var(--bad);border-radius:12px;background:var(--paper);padding:14px;font-weight:700}
.errbox .i{width:28px;height:28px;color:var(--bad)}
.modsw{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-size:.8rem;font-weight:800;border:2px dashed var(--lo);border-radius:9px;padding:2px 8px;color:var(--ink);background:var(--paper)}
.resmsg{margin-top:12px}
.zipwrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.zbox{border:3px solid var(--line);border-radius:16px;background:var(--paper2);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.zhead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid var(--hair)}
.zhead .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--tc)}
.zhead b{font-family:var(--fm);font-size:1rem;display:block}
.zhead b .ren{color:var(--bad);text-decoration:line-through}
.zhead b .new{color:var(--ok)}
.zhead small{color:var(--muted);font-weight:700;font-size:.8rem}
.zbody{padding:10px 12px;display:grid;gap:10px}
.tree{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-family:var(--fm);font-size:.82rem}
.tree li{min-width:0}
.tnode{display:flex;align-items:center;gap:6px;width:100%;border:2px solid transparent;border-radius:8px;background:none;padding:3px 6px;text-align:left;font-family:var(--fm);font-size:.82rem;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.tnode .i{color:var(--muted)}
.tnode.dir{cursor:default;color:var(--muted)}
.tnode.dir .i{color:var(--draw)}
.tnode.lv1{padding-left:24px}
.tnode.lv2{padding-left:42px}
.tnode:not(.dir):hover{background:var(--soft)}
.tnode[aria-pressed="true"]{border-color:var(--line);background:color-mix(in srgb,var(--sun) 30%,var(--paper))}
.tnode.seen:not([aria-pressed="true"])::after{content:"✓";margin-left:auto;color:var(--ok)}
.zprev{border:2px solid var(--hair);border-radius:12px;background:var(--paper);padding:10px 12px;display:grid;gap:8px;min-height:120px}
.zprev p{font-size:.9rem;font-weight:700}
.xml{margin:0;font-family:var(--fm);font-size:.76rem;line-height:1.55;white-space:pre;overflow-x:auto;background:var(--desk);border-radius:8px;padding:8px 10px;color:var(--ink)}
.xml .xt{color:var(--doc);font-weight:700}.xml .xa{color:var(--slide)}.xml .xv{color:var(--sheet)}
.xml mark{background:color-mix(in srgb,var(--sun) 55%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.zimg{display:grid;place-items:center;background:var(--desk);border-radius:8px;padding:8px}
.zimg svg{width:120px;height:100px}
.zclosed{display:grid;place-items:center;gap:10px;padding:18px 10px;text-align:center}
.zclosed svg.boxart{width:120px;height:96px}
.steps{margin:0;padding-left:0;list-style:none;display:grid;gap:8px;counter-reset:st}
.steps label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--hair);border-radius:12px;padding:8px 12px;background:var(--paper2);cursor:pointer;font-weight:600}
.steps input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--mint)}
.steps label:has(input:checked){border-color:var(--ok);background:var(--okbg)}
textarea{width:100%;min-height:80px;resize:vertical;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--paper);font-weight:600;line-height:1.45}
.extg{display:grid;grid-template-columns:minmax(90px,.55fr) minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:12px}
.extg .eh{font-family:var(--fh);font-weight:600;padding:6px 10px;border-radius:10px;display:flex;align-items:center;gap:6px;min-width:0}
.extg .eh.ms{background:var(--ms);color:var(--on-suite)}.extg .eh.lo{background:var(--lo);color:var(--on-suite)}
.extg .er{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;padding:6px 4px;color:var(--tc)}
.extg .er span{color:var(--ink)}
.ecell{min-height:52px;border:3px dashed var(--line);border-radius:12px;background:var(--paper);display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px;color:var(--ink);min-width:0}
.ecell.armed{border-style:solid;background:color-mix(in srgb,var(--sun) 16%,var(--paper))}
.ecell .chip{font-size:.85rem;padding:3px 9px;cursor:default}
.ecell.uni{grid-column:1/-1;min-height:56px}
.uni-l{grid-column:1/-1;font-weight:800;font-size:.88rem;margin-top:4px}
.dlg{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:5px 5px 0 var(--shadow);max-width:640px}
.dlg-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:var(--soft);border-bottom:3px solid var(--line);font-weight:800}
.dlg-b{padding:14px;display:grid;gap:10px}
.dlg-r{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:8px;align-items:center}
.dlg-r label{font-weight:800;font-size:.9rem}
.dlg-r .fname{border:2px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--paper2);font-family:var(--fm);font-weight:700;overflow-wrap:anywhere}
.dlg-r select{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper);font-weight:700;width:100%;min-width:0}
.dlg-f{display:flex;justify-content:flex-end;gap:8px}
.scn{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--sky) 16%,var(--paper));margin-bottom:12px;max-width:640px}
.scn .ava{width:44px;height:44px;flex:none}
.scn p{font-weight:700}
.pdots{display:flex;gap:6px;margin-bottom:10px}
.pdots i{width:28px;height:8px;border-radius:99px;background:var(--hair)}
.pdots i.cur{background:var(--sun)}.pdots i.ok{background:var(--ok)}.pdots i.mid{background:var(--warn)}.pdots i.no{background:var(--bad)}

/* ---------- section 5: ninja ---------- */
.nj{position:relative;border:3px solid var(--line);border-radius:18px;background:var(--paper2);padding:16px;outline:none;display:grid;gap:14px}
.nj-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.nj-meta{display:flex;gap:8px;flex-wrap:wrap}
.nj-meta span{border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--paper)}
.nj-stage{display:grid;place-items:center;text-align:center;min-height:132px;border:2px dashed var(--hair);border-radius:14px;background:var(--paper);padding:12px}
.nj-ask{font-size:.95rem;font-weight:700;color:var(--muted)}
.nj-act{font-family:var(--fh);font-weight:700;font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.1;display:flex;align-items:center;gap:12px;justify-content:center}
.nj-act .i{width:1em;height:1em}
.nj-msg{font-weight:800;min-height:1.4em}
.nj-msg.ok{color:var(--ok)}.nj-msg.no{color:var(--bad)}
.nj.flash-ok .nj-stage{animation:flashok .4s}
.nj.flash-no .nj-stage{animation:shake .38s}
@keyframes flashok{0%{background:var(--okbg)}100%{background:var(--paper)}}
.kb{display:grid;gap:6px;user-select:none;-webkit-user-select:none}
.kb-row{display:flex;gap:5px;justify-content:center}
.kb-row:nth-child(2){padding-left:3%}.kb-row:nth-child(3){padding-left:6%}
.key{flex:1 1 0;max-width:3.1rem;min-width:0;height:2.75rem;border:2px solid var(--line);border-bottom-width:5px;border-radius:9px;background:var(--paper);font-family:var(--fh);font-weight:600;font-size:1rem;display:grid;place-items:center;color:var(--ink);padding:0;transition:transform .06s,border-bottom-width .06s}
.key.ctrl{flex:0 0 auto;max-width:none;width:4.6rem;background:var(--ink);color:var(--paper);font-size:.85rem}
.key.used{background:color-mix(in srgb,var(--lilac) 40%,var(--paper))}
.key.on{transform:translateY(3px);border-bottom-width:2px}
.key.hint{background:var(--sun);color:var(--on-bright);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--sun) 45%,transparent)}}
.key.hit{background:var(--okbg);border-color:var(--ok)}
.key.miss{background:var(--badbg);border-color:var(--bad)}
.nj-over{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--paper2) 80%,transparent);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);border-radius:15px;z-index:3;font-family:var(--fh);font-weight:600;font-size:1.2rem;text-align:center;padding:12px}
.nj-res{display:grid;gap:6px;justify-items:center;text-align:center;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:16px 24px;box-shadow:4px 4px 0 var(--shadow)}
.nj-res.bare{background:none;border:0;box-shadow:none;padding:0}
.nj-res .big{font-family:var(--fh);font-weight:700;font-size:2.4rem;line-height:1}
.cheat{width:100%;border-collapse:collapse;font-size:.95rem}
.cheat td{border-top:2px solid var(--hair);padding:7px 8px}
.cheat td:first-child{white-space:nowrap;width:1%}
.cheatwrap{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}

/* ---------- section 6: drama ---------- */
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.role{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--paper2)}
.role .ri{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--rc,var(--soft));color:var(--on-bright);border:2px solid var(--line);margin-bottom:6px}
.role.ms .ri{background:var(--ms);color:var(--on-suite)}.role.lo .ri{background:var(--lo);color:var(--on-suite)}
.role b{font-family:var(--fh);font-weight:600;display:block}
.role p{font-size:.86rem;color:var(--muted);font-weight:700}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.flow span{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:800;border:2px solid var(--hair);border-radius:99px;padding:2px 10px 2px 3px;background:var(--paper)}
.flow span i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--peach);color:var(--on-bright);font-family:var(--fh);font-size:.75rem}
.client{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;border:3px solid var(--line);border-radius:18px;padding:14px;background:var(--paper)}
.client .ava{width:84px;height:84px}
.client .who{font-weight:800;color:var(--muted);font-size:.9rem}
.client q{display:block;font-family:var(--fh);font-weight:500;font-size:1.2rem;line-height:1.3;margin-top:2px;quotes:"„" "“"}
.client .duo{display:flex}
.client .duo .ava{width:58px;height:58px}
.client .duo .ava+.ava{margin-left:-14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font-size:.78rem;font-weight:800;border-radius:7px;padding:1px 8px;background:var(--soft)}
.client-empty{display:grid;place-items:center;gap:8px;border:3px dashed var(--line);border-radius:18px;padding:24px;text-align:center;font-weight:800;color:var(--muted)}
.dtimers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.dtm{display:grid;gap:6px;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--paper2)}
.dtm .btn{width:100%}
.dtm .tb{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--hair)}
.dtm .tb i{display:block;height:100%;width:100%;background:var(--tcl)}
.dtm.ms{--tcl:var(--ms)}.dtm.lo{--tcl:var(--lo)}
.dtm .tl{font-family:var(--fh);font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.verdict{margin-top:12px}
.reco{margin-top:12px;border:3px solid var(--line);border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--rc) 14%,var(--paper))}
.reco h4{display:flex;align-items:center;gap:8px;font-size:1.1rem}
.reco.ms{--rc:var(--ms)}.reco.lo{--rc:var(--lo)}.reco.both{--rc:var(--sun)}
.kwl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.kwl span{font-size:.8rem;font-weight:800;border:2px solid var(--line);border-radius:99px;padding:0 9px;background:var(--paper)}
.played{display:flex;gap:6px;align-items:center;margin-top:12px;font-weight:800;font-size:.86rem}
.played i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.played i.on{background:var(--peach)}

/* ---------- section 7: myths ---------- */
.myths{display:grid;gap:10px}
.myth{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;border:2px solid var(--hair);border-radius:14px;padding:10px 12px;background:var(--paper2)}
.myth .mn{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--lime);color:var(--on-bright);font-family:var(--fh);font-weight:600;border:2px solid var(--line)}
.myth p{font-weight:700}
.myth .bt{display:flex;gap:6px}
.myth .why{grid-column:2/-1;font-size:.92rem;font-weight:700}
.myth.ok{border-color:var(--ok);background:var(--okbg)}.myth.no{border-color:var(--bad);background:var(--badbg)}
.tf{border:2px solid var(--line);border-radius:10px;padding:5px 12px;font-weight:800;background:var(--paper);color:var(--ink)}
.tf.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.tf.no{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.score{font-family:var(--fh);font-weight:600;font-size:1.15rem;margin-top:12px}

/* ---------- section 8: test & certificate ---------- */
.tq{border:3px solid var(--line);border-radius:18px;background:var(--paper2);padding:16px}
.tq-meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tq-meta .topic{font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:7px;padding:1px 8px;background:var(--rose);color:var(--on-bright)}
.tq h3{font-size:1.3rem;margin-bottom:12px}
.tdots{display:flex;gap:5px;flex-wrap:wrap}
.tdots i{width:20px;height:8px;border-radius:99px;background:var(--hair)}
.tdots i.cur{background:var(--sun)}.tdots i.ok{background:var(--ok)}.tdots i.no{background:var(--bad)}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border:3px solid var(--line);border-radius:18px;padding:16px;background:var(--paper2)}
.gradebox{display:grid;justify-items:center;gap:6px}
.grade{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;border:4px solid var(--stamp);color:var(--stamp);font-family:var(--fh);font-weight:700;font-size:3rem;line-height:1;transform:rotate(-6deg)}
.gradebox small{font-family:var(--fh);font-weight:700;color:var(--stamp);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.result h3{font-size:1.3rem}
.bytopic{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.bytopic span{font-size:.8rem;font-weight:800;border:2px solid var(--line);border-radius:8px;padding:1px 8px;background:var(--paper)}
.cert{position:relative;border:3px solid var(--line);border-radius:18px;background:var(--paper);padding:26px 22px;text-align:center;overflow:hidden;box-shadow:6px 6px 0 var(--shadow)}
.cert::before{content:"";position:absolute;inset:10px;border:2px dashed var(--hair);border-radius:12px;pointer-events:none}
.cert .ct{font-family:var(--fh);font-weight:700;font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:.14em}
.cert .cn{font-family:var(--fh);font-weight:600;font-size:clamp(1.4rem,4.4vw,2rem);border-bottom:3px solid var(--line);display:inline-block;padding:0 18px 2px;margin:8px 0;min-width:60%}
.cert .cr{display:inline-block;margin-top:8px;font-weight:800;background:var(--sun);color:var(--on-bright);border-radius:8px;padding:2px 12px}
.cert .cf{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:.84rem;color:var(--muted);font-weight:700;flex-wrap:wrap}
.cert .cf span{border-top:2px solid var(--hair);padding-top:4px;min-width:40%}
.cert .cseal{position:absolute;right:18px;top:16px;transform:rotate(12deg);border:3px solid var(--stamp);color:var(--stamp);border-radius:50%;width:92px;height:92px;display:grid;place-items:center;font-family:var(--fh);font-weight:700;font-size:.72rem;line-height:1.05;text-align:center;padding:6px}
.selfchk{display:grid;gap:6px}
.selfchk label{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
.selfchk input{width:20px;height:20px;accent-color:var(--mint)}
.namein{border:2px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--paper);font-weight:800;width:min(100%,22rem)}
.sizecmp{display:grid;gap:8px;margin-top:10px}
.sizecmp .field input{max-width:7rem}

/* ---------- footer, toast, timer, dialog ---------- */
.foot{border-top:3px solid var(--line);background:var(--paper);margin-top:30px}
.foot .wrap{padding-block:18px 22px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-weight:700;color:var(--muted);font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 40px));opacity:0;visibility:hidden;z-index:90;border:3px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:8px 16px;font-family:var(--fh);font-weight:600;box-shadow:4px 4px 0 var(--shadow);transition:transform .3s,opacity .3s,visibility .3s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast .stampy{display:inline-block;color:var(--stamp);border:3px solid var(--stamp);border-radius:8px;padding:0 10px;transform:rotate(-5deg);letter-spacing:.06em}
.timer{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:85;display:flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:14px;background:var(--paper);padding:6px 8px 6px 12px;box-shadow:4px 4px 0 var(--shadow);max-width:calc(100vw - 24px)}
.timer .tt{font-family:var(--fh);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;min-width:3.6ch}
.timer .tl{font-size:.78rem;font-weight:800;color:var(--muted);max-width:11rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{border:2px solid var(--line);background:var(--paper2);border-radius:9px;width:34px;height:32px;display:grid;place-items:center;padding:0}
.timer.ding{animation:ding 1s 3;background:color-mix(in srgb,var(--coral) 40%,var(--paper))}
@keyframes ding{50%{transform:scale(1.06)}}
.tdlg{border:3px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:8px 8px 0 var(--shadow)}
.tdlg::backdrop{background:rgba(10,8,30,.55)}
.tdlg-h{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--sun);color:var(--on-bright);border-bottom:3px solid var(--line);z-index:1}
.tdlg-h h2{font-size:1.3rem}
.tdlg-b{padding:16px;display:grid;gap:16px}
.tdlg-b h3{font-size:1.08rem;margin-bottom:6px}
.tdlg-b ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.ptbl{width:100%;border-collapse:collapse;font-size:.9rem}
.ptbl th,.ptbl td{border-top:2px solid var(--hair);padding:6px 8px;text-align:left;vertical-align:top}
.ptbl td:first-child,.ptbl td:nth-child(2){white-space:nowrap}
.ptbl th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ptwrap{overflow-x:auto}
#certPrint{display:none}
.cpick{position:relative;display:inline-grid;place-items:center;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:3px}
.cpick .ava{width:38px;height:38px}
.cpick[aria-pressed="true"]{background:color-mix(in srgb,var(--sun) 40%,var(--paper));box-shadow:2px 2px 0 var(--shadow)}
.cpick .ck{position:absolute;right:-7px;top:-7px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:var(--paper);display:grid;place-items:center;border:2px solid var(--paper)}
.cpick .ck .i{width:12px;height:12px;stroke-width:3}
.cpicks{display:flex;flex-wrap:wrap;gap:8px}
/* locked answers & small fixes */
.opts.locked .opt{cursor:default}
.opts.locked .opt:hover{transform:none;background:var(--paper)}
.opts.locked .opt.ok:hover{background:var(--okbg)}.opts.locked .opt.no:hover{background:var(--badbg)}
.opts.locked .opt.pick:hover{background:color-mix(in srgb,var(--sun) 32%,var(--paper))}.opts.locked .opt.warn:hover{background:var(--warnbg)}
.opts.locked .opt:not(.ok):not(.no):not(.pick):not(.warn){opacity:.6}
[aria-disabled="true"]{cursor:default}
.ha-line{stroke:color-mix(in srgb,var(--muted) 45%,transparent)}
.zone,.ecell{cursor:pointer;font:inherit}
.flip,.flip-in{min-height:220px}
:lang(hu) .bubble q,:lang(hu) .client q{quotes:"„" "”"}
.panel h3,.act-h h3{display:flex;align-items:center;gap:8px}
.tq .opts{margin-top:4px}
.member:hover,.chip:hover:not(.placed),.pick:hover,.tbtn:hover:not([aria-disabled="true"]),.tw-btn:hover:not([aria-disabled="true"]){background:var(--paper2)}
.member[aria-pressed="true"]:hover{background:color-mix(in srgb,var(--sun) 28%,var(--paper))}
.chip[aria-pressed="true"]:hover,.pick[aria-pressed="true"]:hover,.tw-btn[aria-pressed="true"]:hover{background:color-mix(in srgb,var(--sun) 35%,var(--paper))}
.light:hover:not([aria-disabled="true"]),.tf:hover:not([aria-disabled="true"]){background:var(--paper2)}
.tf.ok:hover{background:var(--ok)}.tf.no:hover{background:var(--bad)}
h4{font-family:var(--fh);font-weight:600;margin:0}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art{max-width:340px;order:-1}
  .calc,.lab{grid-template-columns:minmax(0,1fr)}
  .roles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .team{grid-template-columns:repeat(2,minmax(0,1fr))}
  .goals,.zones,.hood,.zipwrap,.dtimers,.opts.two{grid-template-columns:minmax(0,1fr)}
  .free{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lvl{padding:18px 14px 22px;box-shadow:5px 5px 0 var(--shadow)}
  .duel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .duel .dl{grid-column:1/-1}
  .duel .dh.dl{display:none}
  .extg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .extg .er{grid-column:1/-1;padding-bottom:0}
  .extg .eh.dl{display:none}
  .dlg-r{grid-template-columns:minmax(0,1fr)}
  .smr{grid-template-columns:minmax(0,1fr)}
  .myth{grid-template-columns:auto minmax(0,1fr)}
  .myth .bt{grid-column:1/-1}
  .myth .why{grid-column:1/-1}
  .client{grid-template-columns:minmax(0,1fr)}
  .result{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
  .pricegrid{grid-template-columns:minmax(0,1fr)}
  .xp-bar{display:none}
  .iconbtn .lbl{display:none}
  .pgrid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){
  .pgrid:not(.three){grid-template-columns:minmax(0,1fr)}
  .pick.f{word-break:normal}
}
@media (max-width:640px){
  .brand{display:none}
  .top-row{flex-wrap:nowrap;gap:6px;padding-block:7px 5px}
  .xp{flex:1 1 auto;min-width:0;margin-right:auto;gap:6px;padding:3px 8px 3px 4px}
  .xp-rank{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .xp-num{white-space:nowrap}
  .seg button{padding:5px 9px}
  .path{padding-block:0 7px}
}
@media (max-width:420px){
  .gallery{grid-template-columns:minmax(0,1fr)}
  .free{grid-template-columns:minmax(0,1fr)}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  html.printing{--paper:#FFFFFF;--paper2:#F5F7FD;--ink:#1E1B3A;--muted:#55527A;--line:#1E1B3A;--hair:#D2D8EC;--stamp:#C3233F;--sun:#FFC93C;--on-bright:#1E1B3A;color-scheme:light}
  html.printing body>*{display:none!important}
  html.printing body{background:#fff}
  html.printing #certPrint{display:block!important;color:#1E1B3A}
  #certPrint .cert{box-shadow:none;border-color:#1E1B3A;background:#fff;color:#1E1B3A;margin:40px auto;max-width:720px}
  #certPrint .cert .cr{background:#FFC93C;color:#1E1B3A}
  #certPrint .cert .cseal{border-color:#C3233F;color:#C3233F}
}


/* ================= Word: makety okna, pás, stavový riadok, hľadačka ================= */
.lead b,.how b{color:var(--ink)}
.hero .h1b .w{color:var(--doc)}
.zones.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.zone h4 small{font-variant-numeric:tabular-nums}

/* --- celé okno (maketa) --- */
.ww{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper2);font-size:.8rem;line-height:1.25;box-shadow:4px 4px 0 var(--shadow);max-width:860px}
.ww .wp{appearance:none;border:0;margin:0;background:transparent;color:inherit;font:inherit;text-align:left;padding:0;position:relative;display:flex;align-items:center;min-width:0;border-radius:6px;cursor:pointer;transition:background .15s,box-shadow .15s}
.ww .wp:hover{background:color-mix(in srgb,var(--sun) 30%,transparent)}
.ww .wp.sel{box-shadow:inset 0 0 0 3px var(--coral);background:color-mix(in srgb,var(--coral) 18%,transparent)}
.ww.armed .wp:not(.lab){outline:2px dashed var(--muted);outline-offset:-3px}
.ww .wp:focus-visible{outline:3px solid var(--sky);outline-offset:-3px}
.ww-title{display:flex;align-items:center;gap:6px;background:var(--doc);color:var(--paper);padding:5px 6px;min-height:34px}
.ww-qat{gap:2px;padding:3px 5px!important;flex:none}
.ww-qat .i{width:16px;height:16px}
.ww-name{flex:1 1 auto;justify-content:center;padding:4px 6px!important;font-weight:700;white-space:nowrap;overflow:hidden}
.ww-name span{overflow:hidden;text-overflow:ellipsis}
.ww-search{flex:0 1 190px;gap:5px;background:color-mix(in srgb,var(--paper) 22%,transparent)!important;border:1px solid color-mix(in srgb,var(--paper) 45%,transparent)!important;border-radius:7px!important;padding:3px 8px!important;white-space:nowrap;overflow:hidden}
.ww-search .i{width:14px;height:14px}
.ww-tabs{display:flex;gap:14px;padding:5px 10px!important;background:var(--paper);border-bottom:1px solid var(--hair);white-space:nowrap;overflow:hidden;width:100%;font-weight:700}
.ww-tabs span{flex:none}
.ww-tabs .on{color:var(--doc);box-shadow:0 2px 0 var(--doc)}
.ww-rib{display:flex;align-items:stretch;background:var(--paper);border-bottom:2px solid var(--hair);overflow:hidden;min-height:68px}
.ww-rib .wp{align-items:stretch}
.wgrp{display:flex;flex-direction:column;justify-content:space-between;gap:3px;padding:5px 9px 3px;border-right:1px solid var(--hair);flex:none}
.wgrp .tools{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.wgrp .tl{display:inline-grid;place-items:center;min-width:22px;height:22px;border:1px solid var(--hair);border-radius:5px;background:var(--paper2);font-weight:800;font-size:.78rem;padding:0 4px}
.wgrp .tl.big{height:46px;min-width:38px;flex-direction:column}
.wgrp .tl .i{width:15px;height:15px}
.wgrp small{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-size:.68rem;font-weight:800;white-space:nowrap}
.wgrp .launch{display:inline-grid;place-items:center;width:13px;height:13px;border:1px solid var(--muted);border-radius:2px;font-size:.55rem;line-height:1}

.rb{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:4px 4px 0 var(--shadow)}

.cntq{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:12px}

.hrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:start;border:2px solid var(--hair);border-radius:14px;padding:10px 12px;background:var(--paper2)}

.ws-page textarea{min-height:calc(150px * var(--z,1))}
.mis>span.ok .ck .i{stroke:var(--paper);stroke-width:3}

    if(dv&&typeof dv==='object'&&!Array.isArray(dv)&&rv&&typeof rv==='object'&&!Array.isArray(rv)) d[k]=Object.assign(dv,rv);

/* ---------- XP, ranks, toasts ---------- */
const xpTotal=()=>Object.values(S.xp).reduce((a,b)=>a+(+b||0),0);
const rankIdx=x=>{let r=0;RANKS.forEach(([f],i)=>{if(x>=Math.round(f*MAXT))r=i});return r};
const rankName=i=>tr(RANKS[i][1]);
function award(id,pts){
  if(S.xp[id]!=null) return 0;
  pts=+pts||0;
  const before=rankIdx(xpTotal());
  S.xp[id]=pts;persist();
  if(!pts) return 0;
  updXP(pts);
  const after=rankIdx(xpTotal());
  if(after>before) setTimeout(()=>toast(`${ico('award')} ${fill(t('rankUp'),{r:esc(rankName(after))})}`,2600),1300);
  return pts;
}
function updXP(gain){
  const x=xpTotal(),r=rankIdx(x);
  const v=$('#xpVal'),rk=$('#xpRank'),b=$('#xpBar');
  if(v) v.textContent=x; if(rk) rk.textContent=rankName(r); if(b) b.style.width=Math.min(100,x/MAXT*100)+'%';

}

const R={},A={},IN={},CH={},AFTER={},DONE={};
let JUST=null;
const fkOf=x=>x.dataset.fk||(x.dataset.a?x.dataset.a+'|'+(x.dataset.v??''):x.dataset.in?'in|'+x.dataset.in+'|'+(x.dataset.v??''):x.dataset.ch?'ch|'+x.dataset.ch+'|'+(x.dataset.v??''):null);
function grabFocus(root){
  const ae=document.activeElement;
  if(!ae||ae===document.body||!root.contains(ae)) return null;
  let sel=null;try{sel=ae.selectionStart}catch(e){}
  return {k:fkOf(ae),sel};
}
function putFocus(root,f){
  if(!f||!f.k) return;
  const n=$$('[data-fk],[data-a],[data-in],[data-ch]',root).find(x=>fkOf(x)===f.k);
  if(!n) return;
  try{n.focus({preventScroll:true})}catch(e){}
  if(f.sel!=null&&typeof n.setSelectionRange==='function'){try{n.setSelectionRange(f.sel,f.sel)}catch(e){}}
}
function paint(id){
  const el=document.getElementById(id);if(!el||!R[id]) return;
  el.innerHTML=R[id]();
  if(AFTER[id]) AFTER[id](el);
}
function rr(id){
  const nd=checkDone();
  const el=document.getElementById(id);if(!el||!R[id]) return;
  const f=grabFocus(el);
  paint(id);putFocus(el,f);
  nd.filter(x=>x!==id).forEach(paint);
  renderNav();
}
function checkDone(){
  const nd=[];
  for(const s of SECS){
    if(S.done[s.id]||!DONE[s.id]) continue;
    let ok=false;try{ok=!!DONE[s.id]()}catch(e){ok=false}
    if(!ok) continue;
    S.done[s.id]=1;S.doneAt[s.id]=S.act.t;JUST=s.id;nd.push(s.id);persist();
    const id=s.id;setTimeout(()=>{if(JUST===id)JUST=null},1400);
    setTimeout(()=>toast(`<span class="stampy">${t('done')}</span> ${fill(t('secDone'),{n:esc(tr(s.tab))})}`,2600),900);
  }
  return nd;
}

/* multiple-choice block: q={o:[[sk,hu]...],c:index,ex:[sk,hu]} */
function permFor(key,n){
  let h=2166136261;for(const ch of key){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function mcq(name,q,picked,opt={}){
  const L='ABCDEFGH',ans=picked!=null&&picked!=='';
  let h=`<div class="opts${opt.two?' two':''}${ans?' locked':''}" role="group">`;
  permFor(name,q.o.length).forEach((i,k)=>{
    const o=q.o[i];
    let cls='',mk=L[k];
    if(ans){if(i===q.c){cls='ok';mk=ico('check')}else if(i===picked){cls='no';mk=ico('x')}}
    h+=`<button class="opt ${cls}" data-a="${name}" data-v="${i}"${ans?' aria-disabled="true"':''}><span class="mk">${mk}</span><span>${tr(o)}</span></button>`;
  });
  h+='</div>';
  if(ans) h+=`<div class="fb ${picked===q.c?'ok':'no'}" role="status"><b>${picked===q.c?t('correct'):t('wrong')}</b> ${tr(q.ex)}</div>`;
  return h;
}

const TM={end:0,left:0,run:false,done:false,sec:0,iv:0};
let AC=null;
function audioUnlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function beep(){
  if(!AC) return;
  try{const now=AC.currentTime;[0,.32,.64].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(.22,now+d+.02);g.gain.exponentialRampToValueAtTime(.0001,now+d+.24);
    o.connect(g);g.connect(AC.destination);o.start(now+d);o.stop(now+d+.28)})}catch(e){}
}
function startTimer(min,sec){
  audioUnlock();
  TM.left=min*60000;TM.end=Date.now()+TM.left;TM.run=true;TM.done=false;TM.sec=sec;
  clearInterval(TM.iv);TM.iv=setInterval(tick,250);renderTimer();
}
function tick(){
  if(TM.run){TM.left=Math.max(0,TM.end-Date.now());if(TM.left===0){TM.run=false;TM.done=true;beep();toast(`${ico('clock')} ${t('timeUp')}`,2600);renderTimer();}}
  paintTimer();
}
function renderTimer(){
  const el=$('#timer'),f=grabFocus(el);el.hidden=false;
  el.innerHTML=`${ico('clock')}<span class="tt" id="tt" aria-live="off"></span><span class="tl">${esc(tr(SECS[TM.sec].tab))}</span>`+
    `<button data-a="tpause" aria-label="${t(TM.run?'pause':'resume')}" title="${t(TM.run?'pause':'resume')}">${ico(TM.run?'pause':'play')}</button>`+
    `<button data-a="tplus" aria-label="${t('plus1')}" title="${t('plus1')}"><b>+1</b></button>`+
    `<button data-a="tclose" aria-label="${t('close')}" title="${t('close')}">${ico('x')}</button>`;
  putFocus(el,f);paintTimer();
}
function paintTimer(){
  const s=Math.ceil(TM.left/1000),el=$('#tt');
  if(el) el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  $('#timer').classList.toggle('ding',TM.done);
}

A.tplus=()=>{TM.left+=60000;TM.done=false;if(TM.run)TM.end+=60000;else{TM.end=Date.now()+TM.left;TM.run=true}renderTimer()};

    'Známka zo stránky = <b>test 40 %</b> (prvý pokus) + <b>úlohy povinných šanónov 40 %</b> (body na prvý pokus) + <b>aktívny čas 20 %</b> (100 % = aspoň 18 minút aktívnej práce).',
    'Stupnica: výborný 100 – 90 %, chválitebný 89 – 75 %, dobrý 74 – 50 %, dostatočný 49 – 25 %, nedostatočný 24 – 0 %.',
    'Pracovný list hodnoťte zvlášť podľa kľúča (body sú na liste) tou istou stupnicou.',
  ],
  resH:'Výsledky triedy',
  resHow:'Žiaci odovzdajú stiahnuté súbory (napr. ako prílohu úlohy v EduPage). Tu ich načítate všetky naraz. Nič sa nikam neposiela – zoznam ostane len v tomto prehliadači.',
  frame:'Tu v Claude sa tabuľka CSV nestiahne. Výsledky triedy spracujte v žiackom súbore: otvorte ho v prehliadači a na koniec adresy pridajte #ucitel (alebo 5× rýchlo kliknite na logo).',
  impL:'Načítať súbory žiakov (.json)',csv:'Stiahnuť tabuľku (CSV pre Excel)',clr:'Vymazať zoznam',
  impN:'Načítaných žiakov: {n}',impBad:'Tento súbor sa nedal načítať: {f}',none:'Zatiaľ žiadne výsledky.',
  rc:['Meno','Trieda','Aktívny čas','Šanóny','Úlohy','Test','Čas','Spolu','Známka','Kontrola'],
  sigOk:'OK',sigBad:'upravený',other:'iná hodina',
  tipsH:'Tipy',
  tips:[
    'Žiacka verzia nezobrazuje tlačidlo „Pre učiteľa“. Panel otvoríte piatimi rýchlymi kliknutiami na logo vľavo hore alebo adresou, ktorá končí na #ucitel.',
    'Názvy kariet a skupín zodpovedajú slovenskému Wordu v Microsoft 365, maketa je však zjednodušená. Pred hodinou ju porovnajte so školským počítačom – v inej verzii (napríklad Word pre web) sa niektoré názvy môžu líšiť.',
    'Aktívny čas sa počíta, len keď je stránka otvorená v popredí a žiak v poslednej minúte klikol, písal alebo posúval. Ukazuje aktivitu, nie pozornosť – porovnajte ho s pracovným listom. Prílišná rýchlosť (všetko za pár minút) je tiež signál.',
    'Výsledkový súbor má kontrolný kód. Ak ho niekto ručne upraví, v tabuľke uvidíte „upravený“. Je to ochrana proti náhodnému prepisovaniu, nie nerozbitné zabezpečenie.',
    'Žiaci majú licenciu Microsoft 365 A3 – Word si môžu nainštalovať aj doma (až na 5 počítačov), ak to škola v správe kont povolila. Domáca úloha s tým počíta.',
    'Na niektorých notebookoch je F1 multimediálny kláves – vtedy treba Fn + Ctrl + F1. V simulátore funguje aj dvojklik na kartu.',
    'Postup žiaka sa ukladá iba v jeho prehliadači. Na zdieľanom počítači ho po hodine vymažte (nižšie) alebo nech žiaci pracujú v súkromnom okne.',
  ],
  boardL:'Režim tabule – väčšie písmo pre projektor',
  resetH:'Nový žiak na tomto zariadení',resetB:'Vymazať postup na tomto zariadení',
  resetQ:'Naozaj? Zmaže sa XP, odpovede, aktívny čas aj meno.',yes:'Áno, vymazať',no:'Nie',resetDone:'Postup bol vymazaný.',
  srcH:'Zdroje (november 2026)',
  src:[
    ['https://support.microsoft.com/kb/291484','Microsoft – zobrazenie a skrytie pása s nástrojmi (dvojklik na kartu, Ctrl + F1)'],
    ['https://www.gymparnr.edu.sk//obsah/predmety/subory/informatika/svp8god2015.pdf','ŠPÚ – iŠVP Informatika, gymnázium s osemročným vzdelávacím programom'],
    ['https://www.minedu.sk/data/att/2d2/22091.7fd543.pdf','ŠPÚ – iŠVP Informatika, nižšie stredné vzdelávanie'],
    ['https://touchit.sk/ako-na-to-vytvarame-obsah-v-microsoft-word/646779/','TOUCHIT – slovenský Word, karta Referencie'],
    ['https://ftvs.cuni.cz/en/students/study/information-systems/ms-365/desktop-applications-installed-on-your-computer','Licencia A3 – desktopový Office až na 5 PC alebo Macov'],
  ],
};
const IMPKEY=KEY+'-trieda';
let IMP=(()=>{try{return JSON.parse(store.get(IMPKEY)||'[]')}catch(e){return []}})(),IMPMSG='';
let RESETQ=false;
function impRows(){
  return IMP.map(r=>{const c={...r};delete c.sig;const okSig=sig(c)===r.sig;
    return {r,okSig,other:r.lesson!==LESSON.id}}).sort((a,b)=>(a.r.klass+a.r.name).localeCompare(b.r.klass+b.r.name,'sk'));
}
function impTable(){
  if(!IMP.length) return `<p class="small">${TD.none}</p>`;
  return `<div class="ptwrap"><table class="itbl"><thead><tr>${TD.rc.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${impRows().map(({r,okSig,other})=>`<tr><td>${esc(r.name)}</td><td>${esc(r.klass)}</td><td>${mmss(+r.active||0)}</td><td>${(r.done||[]).length} / ${MAND().length}${(r.bonusDone||[]).length?` +${r.bonusDone.length}★`:''}</td><td>${r.tasks} %</td><td>${r.test&&r.test.pct!=null?r.test.pct+' %':'–'}</td><td>${r.time} %</td><td><b>${r.total!=null?r.total+' %':'–'}</b></td><td><b>${r.grade??'–'}</b></td><td class="${okSig&&!other?'ok':'bad'}">${other?TD.other:okSig?TD.sigOk:TD.sigBad}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderTeacher(){
  const li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  return `<div class="tdlg-h"><h2 id="tdlgT">${ico('cap')} ${TD.h}</h2><button class="iconbtn sq" data-a="tdclose" aria-label="${t('close')}">${ico('x')}</button></div><div class="tdlg-b">`+
    `<section><h3>Ciele hodiny</h3>${li(H.goals)}</section>`+
    `<section><h3>${TD.stdH}</h3><div class="std">${TD.std.map(x=>`<p>${x}</p>`).join('')}</div></section>`+
    `<section><h3>${TD.planH}</h3><div class="ptwrap"><table class="ptbl"><thead><tr>${TD.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${TD.plan.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]==='–'?'–':p[1]+' · '+esc(SECS[+p[1]-1].tab)}</td><td>${p[2]}</td></tr>`).join('')}</tbody></table></div><p class="small mt">${TD.bonus}</p></section>`+
    `<section><h3>${TD.sayH}</h3><div class="say">${TD.say.map(([c,x])=>`<p style="--c:var(--${c})">${x}</p>`).join('')}</div></section>`+
    `<section><h3>${TD.warmH}</h3><ol>${TD.warm.map(x=>`<li>${x}</li>`).join('')}</ol></section>`+
    `<section><h3>${TD.gradeH}</h3>${li(TD.grade)}</section>`+
    `<section><h3>${TD.resH}</h3><div class="imp"><p class="small">${TD.resHow}</p>${INFRAME?`<div class="fb warn">${TD.frame}</div>`:''}<label class="btn ghost sm" style="cursor:pointer">${ico('upload')} ${TD.impL}<input type="file" accept=".json,application/json" multiple data-ch="imp" class="sr"></label>`+
      `${IMPMSG?`<div class="fb warn">${IMPMSG}</div>`:''}<p class="small"><b>${fill(TD.impN,{n:IMP.length})}</b></p>${impTable()}`+
      (IMP.length?`<div class="row"><button class="btn mint sm" data-a="impcsv">${ico('download')} ${TD.csv}</button><button class="btn ghost sm" data-a="impclr">${ico('reset')} ${TD.clr}</button></div>`:'')+`</div></section>`+
    `<section><h3>${TD.tipsH}</h3>${li(TD.tips)}</section>`+
    `<section><label class="row" style="cursor:pointer"><input type="checkbox" data-ch="board" ${document.documentElement.classList.contains('board')?'checked':''} style="width:20px;height:20px;accent-color:var(--mint)"> <b>${ico('board')} ${TD.boardL}</b></label></section>`+
    `<section><h3>${TD.resetH}</h3>${RESETQ?`<div class="fb warn"><p><b>${TD.resetQ}</b></p><div class="row mt"><button class="btn coral sm" data-a="tresetYes">${ico('reset')} ${TD.yes}</button><button class="btn ghost sm" data-a="tresetNo">${TD.no}</button></div></div>`:`<button class="btn ghost sm" data-a="treset">${ico('reset')} ${TD.resetB}</button>`}</section>`+
    `<section><h3>${TD.srcH}</h3><ul>${TD.src.map(s=>`<li><a href="${s[0]}" target="_blank" rel="noopener noreferrer">${s[1]}</a></li>`).join('')}</ul><p class="small mt">${t('author')}</p></section></div>`;
}
function teacherPaint(){const d=$('#tdlg'),f=grabFocus(d);d.innerHTML=renderTeacher();putFocus(d,f)}
A.teacher=()=>{const d=$('#tdlg');RESETQ=false;IMPMSG='';d.innerHTML=renderTeacher();
  if(typeof d.showModal==='function'){try{d.showModal()}catch(e){d.setAttribute('open','')}}else d.setAttribute('open','');
  const c=d.querySelector('[data-a="tdclose"]');if(c) c.focus({preventScroll:true})};
A.tdclose=()=>{const d=$('#tdlg');try{d.close()}catch(e){d.removeAttribute('open')}};
A.treset=()=>{RESETQ=true;teacherPaint();const b=$('#tdlg [data-a="tresetNo"]');if(b) b.focus({preventScroll:true})};
A.tresetNo=()=>{RESETQ=false;teacherPaint()};
A.tresetYes=()=>{store.del(KEY);S=S0();S.act.first=new Date().toISOString();S.act.sessions=1;RESETQ=false;resetTransient();renderAll();teacherPaint();toast(`${ico('reset')} ${TD.resetDone}`,2200)};
CH.board=el=>{document.documentElement.classList.toggle('board',el.checked);store.set('kb-board',el.checked?'1':'0');setPad()};
CH.imp=el=>{
  const files=[...(el.files||[])];IMPMSG='';let left=files.length;if(!left) return;
  const bad=[];
  files.forEach(f=>{const rd=new FileReader();
    rd.onload=()=>{try{const r=JSON.parse(rd.result);if(!r||r.app!=='inf-hodina'||typeof r.name!=='string') throw 0;
        const i=IMP.findIndex(x=>x.lesson===r.lesson&&x.name===r.name&&x.klass===r.klass);if(i>=0) IMP[i]=r;else IMP.push(r)}catch(e){bad.push(f.name)}
      if(--left===0) impDone(bad)};
    rd.onerror=()=>{bad.push(f.name);if(--left===0) impDone(bad)};
    rd.readAsText(f)});
};
function impDone(bad){store.set(IMPKEY,JSON.stringify(IMP));IMPMSG=bad.map(f=>fill(TD.impBad,{f:esc(f)})).join('<br>');teacherPaint()}
A.impclr=()=>{IMP=[];store.del(IMPKEY);IMPMSG='';teacherPaint()};
A.impcsv=()=>{
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['Meno','Trieda','Hodina','Aktívny čas (min)','Povinné šanóny','Bonusové šanóny','Úlohy %','Test body','Test %','Čas %','Spolu %','Známka','Kontrola','Uložené'];
  const rows=impRows().map(({r,okSig,other})=>[r.name,r.klass,r.lessonName,(Math.round((+r.active||0)/6)/10).toString().replace('.',','),(r.done||[]).length,(r.bonusDone||[]).length,r.tasks,r.test?r.test.first:'',r.test?r.test.pct:'',r.time,r.total,r.grade,other?TD.other:okSig?TD.sigOk:TD.sigBad,r.saved]);
  download(`${LESSON.id}_vysledky.csv`,'﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');
};
function resetTransient(){
  WSEL=null;LSEL=null;LFB=null;SSEL=null;SFB=null;Object.assign(RB,{tab:'home',col:false,peek:false});
  clearInterval(HT.iv);Object.assign(HT,{run:false,order:[],i:0,t0:0,miss:0,iv:0,msg:'',mcls:'',fin:null});
  for(const k of Object.keys(HLAST)) delete HLAST[k];
  JUST=null;
}
/* ---------- sledovanie aktívneho času ---------- */
let LASTIN=Date.now();
function curSec(){const y=innerHeight*.4;for(const s of SECS){const el=document.getElementById(s.id);if(!el) continue;const r=el.getBoundingClientRect();if(r.top<=y&&r.bottom>y) return s.id}return null}
function trackTick(){
  if(document.visibilityState!=='visible') return;
  try{if(!document.hasFocus()) return}catch(e){}
  if(Date.now()-LASTIN>60000) return;
  S.act.t++;const s=curSec();if(s) S.act.sec[s]=(S.act.sec[s]||0)+1;
  if(S.act.t%10===0) persist();
  const el=$('#actT');if(el) el.textContent=mmss(S.act.t);
}
function init(){
  const th=store.get('kb-theme');if(th==='dark'||th==='light') document.documentElement.dataset.theme=th;
  if(store.get('kb-board')==='1') document.documentElement.classList.add('board');
  loadState();
  if(!S.act.first) S.act.first=new Date().toISOString();
  S.act.sessions=(S.act.sessions||0)+1;persist();
  document.documentElement.lang='sk';document.title=t('title');
  renderAll();
  ['pointerdown','keydown','wheel','touchstart','input','scroll'].forEach(ev=>addEventListener(ev,()=>{LASTIN=Date.now()},{passive:true,capture:true}));
  setInterval(trackTick,1000);
  addEventListener('pagehide',()=>store.set(KEY,JSON.stringify(S)));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') store.set(KEY,JSON.stringify(S))});
  addEventListener('resize',()=>setPad());
  try{new ResizeObserver(()=>setPad()).observe($('#top'))}catch(e){}
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.matches&&e.target.matches('[data-in="cnt"]')){e.preventDefault();A.cntChk()}});
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme) renderTop()})}catch(e){}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>setPad());
  $('#tdlg').addEventListener('click',e=>{if(e.target.id==='tdlg') A.tdclose()});
  addEventListener('hashchange',()=>{renderTop();setPad();if(false&&STUDENT) A.teacher()});
  const h=location.hash.slice(1);if(h&&/^[\w-]+$/.test(h)&&document.getElementById(h)) setTimeout(()=>document.getElementById(h).scrollIntoView(),60);
}
init();

</script>
