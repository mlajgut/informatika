<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Súbory a priečinky II.C</title>
<meta name="author" content="Miroslav Lajgút">
<!-- Autor: Miroslav Lajgút · Informatika · II.C -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Student IT helpdesk: every mission level is a ticket folder; file-type colours carry meaning everywhere (document, sheet, image, audio, video, archive, program, web) */
:root{
  --desk:#E9EEF2;--paper:#FFFFFF;--paper2:#F4F7F9;--ink:#15202B;--muted:#4F5B68;--line:#15202B;--hair:#D3DCE3;--soft:#E2E9EE;--shadow:#15202B;
  --t-doc:#2B5FD9;--t-sheet:#0F7A3D;--t-img:#B8500C;--t-aud:#7A44D6;--t-vid:#BE2D69;--t-zip:#8A6100;--t-exe:#B42318;--t-web:#0B7A86;--t-dir:#B88300;
  --sun:#F9C74F;--mint:#43C6AC;--coral:#F28482;--sky:#6CC4E8;--lilac:#B8A1E8;--peach:#F6B486;--lime:#B5D96A;--rose:#EFA7C5;--on-bright:#15202B;
  --ok:#0F6E3A;--okbg:#DDF1E5;--bad:#B42318;--badbg:#FBE4E2;--warn:#8A5300;--warnbg:#FFF0CC;--stamp:#C0263F;
  --go:#2BB673;--mid:#E9A23B;--stop:#E5484D;
  --fh:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --fb:"Nunito","Segoe UI",system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F171E;--paper:#18232D;--paper2:#141E27;--ink:#E8F0F5;--muted:#A9B8C4;--line:#7F95A6;--hair:#2A3946;--soft:#223140;--shadow:#05090C;
  --t-doc:#8AABFF;--t-sheet:#5BD893;--t-img:#FF9F66;--t-aud:#BC9BFF;--t-vid:#FF86B5;--t-zip:#E9C14D;--t-exe:#FF8E8E;--t-web:#4FD1DB;--t-dir:#F2C14E;
  --ok:#62DE9B;--okbg:#143A28;--bad:#FF8E8E;--badbg:#45161E;--warn:#FFCB6B;--warnbg:#3B2C10;--stamp:#FF7590;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0F171E;--paper:#18232D;--paper2:#141E27;--ink:#E8F0F5;--muted:#A9B8C4;--line:#7F95A6;--hair:#2A3946;--soft:#223140;--shadow:#05090C;
  --t-doc:#8AABFF;--t-sheet:#5BD893;--t-img:#FF9F66;--t-aud:#BC9BFF;--t-vid:#FF86B5;--t-zip:#E9C14D;--t-exe:#FF8E8E;--t-web:#4FD1DB;--t-dir:#F2C14E;
  --ok:#62DE9B;--okbg:#143A28;--bad:#FF8E8E;--badbg:#45161E;--warn:#FFCB6B;--warnbg:#3B2C10;--stamp:#FF7590;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{font-size:17px;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 128px)}
html.board{font-size:20px}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--fb);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.15;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:8px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
.mono{font-family:var(--fm);font-size:.92em}
kbd{font-family:var(--fh);font-weight:600;font-size:.92em;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:7px;padding:0 .45em;white-space:nowrap}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.small{font-size:.88rem;color:var(--muted)}
.mt{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h4{font-family:var(--fh);font-weight:600;margin:0}
[aria-disabled="true"]{cursor:default}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--paper);border-bottom:3px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:9px 6px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;text-decoration:none}
.brand svg{width:40px;height:40px;flex:none}
.brand b{display:block;font-family:var(--fh);font-weight:700;font-size:1.06rem;line-height:1.1}
.brand small{display:block;font-size:.76rem;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.xp{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:4px 10px 4px 6px;background:var(--paper2);font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums}
.xp-rank{font-family:var(--fh);font-weight:600;background:var(--sun);color:var(--on-bright);border-radius:8px;padding:1px 8px;white-space:nowrap}
.xp-num b{font-family:var(--fh);font-size:1.05rem}
.xp-bar{width:64px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--hair)}
.xp-bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .5s}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--paper);padding:5px 11px;font-weight:800;font-size:.85rem;letter-spacing:.04em}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;font-weight:800;font-size:.85rem;min-height:36px}
.iconbtn.sq{width:38px;justify-content:center;padding:0}
.path{display:flex;gap:6px;overflow-x:auto;padding-block:2px 9px;scrollbar-width:thin}
.path a{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;font-weight:800;font-size:.82rem;padding:3px 10px 3px 3px;border:2px solid var(--line);border-radius:10px;background:var(--paper)}
.path a .n{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--c);color:var(--on-bright);font-family:var(--fh);font-weight:600;font-size:.82rem}
.path a.done{background:color-mix(in srgb,var(--ok) 12%,var(--paper));border-color:var(--ok)}
.path a.done .n{background:var(--ok);color:var(--paper)}

/* ---------- hero ---------- */
main{padding-block:26px 40px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center}
.kicker{display:inline-block;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hero h1{font-weight:700;font-size:clamp(2.2rem,5.8vw,3.6rem);letter-spacing:-.02em}
.hero .h1b{display:block;font-size:.48em;font-weight:600;letter-spacing:0;margin-top:8px;color:var(--muted)}
.story{font-size:1.08rem;max-width:62ch;margin-top:14px}
.hero-art{width:100%;max-width:460px;height:auto;justify-self:center;overflow:visible}
.ha-float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ha-float.f2{animation-delay:-1.7s}.ha-float.f3{animation-delay:-3.4s}
@keyframes float{50%{transform:translateY(-8px)}}
.team-h{font-family:var(--fh);font-weight:600;font-size:1.05rem;margin:22px 0 10px}
.team{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.member{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);border-radius:14px;background:var(--paper);padding:10px 6px 9px;text-align:center;color:var(--ink)}
.member .ava{width:56px;height:56px}
.member b{font-family:var(--fh);font-weight:600;font-size:1rem;line-height:1.15}
.member small{font-size:.74rem;font-weight:800;color:var(--muted);line-height:1.2}
.member:hover{background:var(--paper2)}
.member[aria-pressed="true"],.member[aria-pressed="true"]:hover{background:color-mix(in srgb,var(--sun) 28%,var(--paper));box-shadow:3px 3px 0 var(--shadow)}
.bubble{margin-top:12px;border:2px solid var(--line);border-radius:16px;background:var(--paper);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.bubble .ava{width:46px;height:46px;flex:none}
.bubble q{font-family:var(--fh);font-weight:500;font-size:1.1rem;quotes:"„" "“"}
:lang(hu) .bubble q{quotes:"„" "”"}
.bubble .go{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:800;font-size:.86rem;color:var(--muted);text-decoration:none;border-bottom:2px dotted var(--hair)}
.goals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:26px}
.panel{border:2px solid var(--line);border-radius:18px;background:var(--paper);padding:16px 18px}
.panel h3{font-size:1.15rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.goals ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.plan{display:flex;flex-wrap:wrap;gap:6px}
.plan a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:2px solid var(--line);border-radius:10px;padding:3px 9px 3px 3px;font-weight:800;font-size:.84rem;background:var(--paper)}
.plan a .n{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--c);color:var(--on-bright);font-family:var(--fh)}
.plan a em{font-style:normal;color:var(--muted);font-weight:700}
.plan-note{font-size:.86rem;color:var(--muted);margin-top:8px}

/* ---------- ticket folders ---------- */
.lvl{position:relative;margin-top:62px;background:var(--paper);border:3px solid var(--line);border-radius:0 22px 22px 22px;box-shadow:7px 7px 0 var(--shadow);padding:22px 24px 26px}
.lvl-tab{position:absolute;left:-3px;bottom:100%;display:flex;align-items:center;gap:9px;background:var(--c);color:var(--on-bright);border:3px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:5px 16px 4px 6px;font-family:var(--fh);font-weight:600;font-size:1rem}
.lvl-tab .n{display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--paper);color:var(--ink);border:2px solid var(--line);font-family:var(--fm);font-weight:700;font-size:.8rem}
.stamp{position:absolute;right:20px;top:-26px;transform:rotate(-7deg);border:3px solid var(--stamp);color:var(--stamp);background:color-mix(in srgb,var(--paper) 88%,transparent);font-family:var(--fh);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:1rem;padding:2px 12px;border-radius:9px;pointer-events:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--stamp) 25%,transparent)}
.stamp.new{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:rotate(-7deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:rotate(-7deg) scale(1)}}
.lvl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 18px;flex-wrap:wrap}
.lvl-ttl{min-width:0;flex:1 1 420px}
.lvl-head h2{font-size:clamp(1.5rem,3.4vw,2.05rem);font-weight:600}
.lead{color:var(--muted);max-width:70ch;margin-top:8px;font-size:1.02rem}
.tchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper2);border-radius:10px;padding:4px 10px;font-weight:800;font-size:.85rem}
.tchip em{font-style:normal;background:var(--c);color:var(--on-bright);border-radius:6px;padding:0 6px;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em}
.tchip:hover{background:var(--soft)}
.act{border-top:2px dashed var(--hair);padding-top:20px;margin-top:22px}
.act-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
.act-h h3{font-size:1.24rem;display:flex;align-items:center;gap:8px}
.kind{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.how{color:var(--muted);font-size:.94rem;margin:0 0 12px;max-width:75ch}

/* ---------- buttons, choices, feedback ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--fh);font-weight:600;font-size:1rem;border:3px solid var(--line);border-radius:12px;padding:7px 16px;background:var(--sun);color:var(--on-bright);box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){filter:brightness(1.04)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.mint{background:var(--mint)}.btn.sky{background:var(--sky)}.btn.coral{background:var(--coral)}
.btn.sm{font-size:.9rem;padding:4px 11px;border-width:2px;box-shadow:2px 2px 0 var(--shadow)}
.btn:disabled{opacity:.45}
.linkbtn{border:0;background:none;padding:0;font-weight:800;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 13px;font-weight:700;color:var(--ink);transition:transform .1s,background .1s}
.opt:hover{background:var(--paper2);transform:translateX(2px)}
.opt .mk{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);font-family:var(--fh);font-weight:600;font-size:.85rem;background:var(--paper2)}
.opt.pick{background:color-mix(in srgb,var(--sun) 32%,var(--paper))}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .mk{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.no{background:var(--badbg);border-color:var(--bad)}
.opt.no .mk{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opts.locked .opt{cursor:default;transform:none}
.opts.locked .opt:not(.ok):not(.no):not(.pick){opacity:.6;background:var(--paper)}
.opts.locked .opt.ok:hover{background:var(--okbg)}.opts.locked .opt.no:hover{background:var(--badbg)}
.opts.locked .opt.pick:hover{background:color-mix(in srgb,var(--sun) 32%,var(--paper))}
.fb{margin-top:12px;padding:10px 14px;border-radius:12px;border:2px solid var(--hair);background:var(--paper2);font-weight:600;max-width:80ch}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.no{border-color:var(--bad);background:var(--badbg)}
.fb.warn{border-color:var(--warn);background:var(--warnbg)}
.fb b{font-family:var(--fh);font-weight:600}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.qcard{border:2px solid var(--hair);border-radius:14px;padding:12px 14px;background:var(--paper2);margin-top:12px}
.qcard p.q{font-weight:800;margin-bottom:8px}
.fact{display:flex;gap:12px;align-items:flex-start;margin-top:14px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--sun) 20%,var(--paper))}
.fact>.i{width:26px;height:26px;margin-top:2px}

/* ---------- sorting chips ---------- */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:5px 12px 5px 5px;font-weight:800;color:var(--ink);font-size:.95rem;text-align:left}
.chip .ic{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:color-mix(in srgb,var(--tc,var(--muted)) 16%,var(--paper));color:var(--tc,var(--muted))}
.chip:hover:not(.placed){background:var(--paper2)}
.chip[aria-pressed="true"],.chip[aria-pressed="true"]:hover{background:color-mix(in srgb,var(--sun) 35%,var(--paper));box-shadow:3px 3px 0 var(--shadow);transform:translate(-1px,-1px)}
.chip.placed{border-color:var(--ok);cursor:default}
.chip.file{font-family:var(--fm);font-size:.92rem;padding:6px 12px}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.zones.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:left;border:3px dashed var(--zc,var(--line));border-radius:16px;padding:10px;min-height:110px;background:color-mix(in srgb,var(--zc,var(--soft)) 7%,var(--paper));color:var(--ink);cursor:pointer;font:inherit}
.zone.armed{border-style:solid;box-shadow:0 0 0 4px color-mix(in srgb,var(--zc,var(--sun)) 25%,transparent)}
.zone h4{display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--zc,var(--ink))}
.zone h4 small{font-family:var(--fb);font-weight:700;font-size:.78rem;color:var(--muted);margin-left:auto}
.zone .in{display:flex;flex-wrap:wrap;gap:6px}
.zone .in .chip{font-size:.82rem;padding:3px 9px}

/* ---------- definition cards ---------- */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.flip{border:0;background:none;padding:0;perspective:900px;text-align:left;color:var(--ink);min-height:214px}
.flip-in{position:relative;display:block;width:100%;height:100%;min-height:214px;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip[aria-pressed="true"] .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border:3px solid var(--line);border-radius:16px;background:var(--paper);padding:14px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.face.front{align-items:center;justify-content:center;text-align:center;background:color-mix(in srgb,var(--tc) 10%,var(--paper))}
.face.front .big{display:grid;place-items:center;width:60px;height:60px;border-radius:16px;background:var(--paper);border:3px solid var(--line);color:var(--tc)}
.face.front .big .i{width:32px;height:32px}
.face.front b{font-family:var(--fh);font-weight:600;font-size:1.2rem}
.face.front small{color:var(--muted);font-weight:700;font-size:.8rem}
.face.back{transform:rotateY(180deg)}
.face.back b{font-family:var(--fh);font-weight:600;font-size:1.05rem;color:var(--tc)}
.face.back p{font-size:.92rem;font-weight:600}
.face.back .ex{font-family:var(--fm);font-size:.8rem;background:var(--paper2);border:2px solid var(--hair);border-radius:8px;padding:4px 8px;overflow-wrap:anywhere}
.face.back .tw{margin-top:auto;font-size:.78rem;font-weight:800;color:var(--muted)}

/* ---------- three-way semaphore & myths ---------- */
.sema{display:grid;gap:10px}
.smr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;border:2px solid var(--hair);border-radius:14px;padding:10px 12px;background:var(--paper2)}
.smr .nm{font-family:var(--fm);font-weight:700;font-size:.98rem;overflow-wrap:anywhere;background:var(--paper);border:2px solid var(--hair);border-radius:8px;padding:4px 10px;justify-self:start;max-width:100%}
.smr .bt{display:flex;gap:6px;flex-wrap:wrap}
.smr .why{grid-column:1/-1;font-size:.92rem;font-weight:700}
.smr.ok{border-color:var(--ok);background:var(--okbg)}.smr.no{border-color:var(--bad);background:var(--badbg)}
.light{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:800;font-size:.84rem;background:var(--paper);color:var(--ink)}
.light::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--lc)}
.light.g{--lc:var(--go)}.light.m{--lc:var(--mid)}.light.r{--lc:var(--stop)}
.light.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 45%,transparent)}
.light:hover:not([aria-disabled="true"]){background:var(--paper2)}
.myths{display:grid;gap:10px}
.myth{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;border:2px solid var(--hair);border-radius:14px;padding:10px 12px;background:var(--paper2)}
.myth .mn{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--lime);color:var(--on-bright);font-family:var(--fh);font-weight:600;border:2px solid var(--line)}

.field{display:grid;gap:4px}

.steps{margin:0;padding-left:0;list-style:none;display:grid;gap:8px}

.steps input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--mint)}

.tq{border:3px solid var(--line);border-radius:18px;background:var(--paper2);padding:16px}
.tq-meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tq-meta .topic{font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:7px;padding:1px 8px;background:var(--rose);color:var(--on-bright)}
.tq h3{font-size:1.3rem;margin-bottom:12px}
.tdots{display:flex;gap:5px;flex-wrap:wrap}
.tdots i{width:20px;height:8px;border-radius:99px;background:var(--hair)}
.tdots i.cur{background:var(--sun)}.tdots i.ok{background:var(--ok)}.tdots i.no{background:var(--bad)}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border:3px solid var(--line);border-radius:18px;padding:16px;background:var(--paper2)}
.gradebox{display:grid;justify-items:center;gap:6px}
.grade{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;border:4px solid var(--stamp);color:var(--stamp);font-family:var(--fh);font-weight:700;font-size:3rem;line-height:1;transform:rotate(-6deg)}
.gradebox small{font-family:var(--fh);font-weight:700;color:var(--stamp);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.result h3{font-size:1.3rem}
.bytopic{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.bytopic span{font-size:.8rem;font-weight:800;border:2px solid var(--line);border-radius:8px;padding:1px 8px;background:var(--paper)}
.cert{position:relative;border:3px solid var(--line);border-radius:18px;background:var(--paper);padding:26px 22px;text-align:center;overflow:hidden;box-shadow:6px 6px 0 var(--shadow)}
.cert::before{content:"";position:absolute;inset:10px;border:2px dashed var(--hair);border-radius:12px;pointer-events:none}
.cert .ct{font-family:var(--fh);font-weight:700;font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:.14em}
.cert .cn{font-family:var(--fh);font-weight:600;font-size:clamp(1.4rem,4.4vw,2rem);border-bottom:3px solid var(--line);display:inline-block;padding:0 18px 2px;margin:8px 0;min-width:60%}
.cert .cr{display:inline-block;margin-top:8px;font-weight:800;background:var(--sun);color:var(--on-bright);border-radius:8px;padding:2px 12px}
.cert .cf{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:.84rem;color:var(--muted);font-weight:700;flex-wrap:wrap}
.cert .cf span{border-top:2px solid var(--hair);padding-top:4px;min-width:40%}
.cert .cseal{position:absolute;right:18px;top:16px;transform:rotate(12deg);border:3px solid var(--stamp);color:var(--stamp);border-radius:50%;width:92px;height:92px;display:grid;place-items:center;font-family:var(--fh);font-weight:700;font-size:.72rem;line-height:1.05;text-align:center;padding:6px}
.selfchk{display:grid;gap:6px}
.selfchk label{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
.selfchk input{width:20px;height:20px;accent-color:var(--mint)}
.namein{border:2px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--paper);font-weight:800;width:min(100%,22rem)}

/* ---------- footer, toast, timer, teacher dialog ---------- */
.foot{border-top:3px solid var(--line);background:var(--paper);margin-top:30px}
.foot .wrap{padding-block:18px 22px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-weight:700;color:var(--muted);font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 40px));opacity:0;visibility:hidden;z-index:90;border:3px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:8px 16px;font-family:var(--fh);font-weight:600;box-shadow:4px 4px 0 var(--shadow);transition:transform .3s,opacity .3s,visibility .3s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast .stampy{display:inline-block;color:var(--stamp);border:3px solid var(--stamp);border-radius:8px;padding:0 10px;transform:rotate(-5deg);letter-spacing:.06em}
.timer{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:85;display:flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:14px;background:var(--paper);padding:6px 8px 6px 12px;box-shadow:4px 4px 0 var(--shadow);max-width:calc(100vw - 24px)}
.timer .tt{font-family:var(--fh);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;min-width:3.6ch}
.timer .tl{font-size:.78rem;font-weight:800;color:var(--muted);max-width:11rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{border:2px solid var(--line);background:var(--paper2);border-radius:9px;width:34px;height:32px;display:grid;place-items:center;padding:0}
.timer.ding{animation:ding 1s 3;background:color-mix(in srgb,var(--coral) 40%,var(--paper))}
@keyframes ding{50%{transform:scale(1.06)}}
.tdlg{border:3px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:8px 8px 0 var(--shadow)}
.tdlg::backdrop{background:rgba(8,14,20,.55)}
.tdlg-h{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--sun);color:var(--on-bright);border-bottom:3px solid var(--line);z-index:1}
.tdlg-h h2{font-size:1.3rem;display:flex;align-items:center;gap:8px}
.tdlg-b{padding:16px;display:grid;gap:16px}
.tdlg-b h3{font-size:1.08rem;margin-bottom:6px}
.tauth{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:.95rem}
.tdlg-b ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.ptbl{width:100%;border-collapse:collapse;font-size:.9rem}
.ptbl th,.ptbl td{border-top:2px solid var(--hair);padding:6px 8px;text-align:left;vertical-align:top}
.ptbl td:first-child,.ptbl td:nth-child(2){white-space:nowrap}
.ptbl th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ptwrap{overflow-x:auto}
#certPrint{display:none}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art{max-width:360px;order:-1}
  .team{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .zones.four{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .brand{display:none}
  .top-row{flex-wrap:nowrap;gap:6px;padding-block:7px 5px}
  .xp{flex:1 1 auto;min-width:0;margin-right:auto;gap:6px;padding:3px 8px 3px 4px}
  .xp-rank{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .xp-num{white-space:nowrap}
  .xp-bar{display:none}
  .seg button{padding:5px 9px}
  .iconbtn .lbl{display:none}
  .path{padding-block:0 7px}
  .team{grid-template-columns:repeat(2,minmax(0,1fr))}
  .goals,.zones,.opts.two{grid-template-columns:minmax(0,1fr)}
  .lvl{padding:18px 14px 22px;box-shadow:5px 5px 0 var(--shadow)}
  .smr{grid-template-columns:minmax(0,1fr)}
  .myth{grid-template-columns:auto minmax(0,1fr)}
  .myth .bt,.myth .why{grid-column:1/-1}
  .result{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
}
@media (max-width:440px){
  .gallery,.zones.four{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  :root.printing,:root.printing:not([data-theme="light"]),:root.printing[data-theme="dark"]{--paper:#FFFFFF;--paper2:#F4F7F9;--ink:#15202B;--muted:#4F5B68;--line:#15202B;--hair:#D3DCE3;--stamp:#C0263F;--sun:#F9C74F;--on-bright:#15202B;color-scheme:light}
  html.printing body>*{display:none!important}
  html.printing body{background:#fff}

  #certPrint .cert{box-shadow:none;margin:40px auto;max-width:720px}
}

<body>
<style>
/* ---------- hero art ---------- */
.ha-win{fill:var(--paper);stroke:var(--line);stroke-width:3.5}
.ha-bar{fill:var(--soft);stroke:var(--line);stroke-width:3.5}
.ha-addr{fill:var(--paper2);stroke:var(--line);stroke-width:2.5}
.ha-addrt{fill:var(--ink);font:700 13px var(--fm)}
.ha-line{fill:none;stroke:var(--hair);stroke-width:4;stroke-linecap:round}
.ha-dir{fill:var(--t-dir);stroke:var(--line);stroke-width:2.5}
.ha-lbl{fill:var(--ink);font:700 14px var(--fb)}
.ha-chip{stroke:var(--line);stroke-width:2.5}

.ha-shadow{fill:var(--hair)}

/* ---------- file icons ---------- */
.fic{width:44px;height:50px;flex:none;overflow:visible}

/* ---------- file explorer mock ---------- */
.fx{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:5px 5px 0 var(--shadow)}
.fx-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--soft);border-bottom:2px solid var(--line);font-weight:800;font-size:.84rem;min-width:0}
.fx-bar .dots{display:flex;gap:5px}
.fx-bar .dots i{width:10px;height:10px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line)}
.fx-bar .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;border-bottom:2px solid var(--hair);background:var(--paper2)}
.fx-nav{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);padding:0;flex:none}

.fxi:hover{background:var(--paper2);border-color:var(--hair)}
.fxi[aria-pressed="true"],.fxi[aria-pressed="true"]:hover{background:color-mix(in srgb,var(--sky) 22%,var(--paper));border-color:var(--line)}
.fxi.found{box-shadow:inset 0 0 0 2px var(--ok)}
.fxi .fn{font-size:.84rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}

.fx-status .full{font-family:var(--fm);color:var(--ink);overflow-wrap:anywhere;min-width:0}
.missions{display:grid;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.missions li{display:flex;gap:10px;align-items:center;border:2px solid var(--hair);border-radius:12px;padding:7px 12px;background:var(--paper2);font-weight:700}

.fxr.hd{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--paper2)}

.fxr .x{color:var(--t-exe);font-weight:800}

.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--line);transition:transform .2s}

.rules{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rules li{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;font-weight:600}
.rules li .i{margin-top:3px}
.rules li.err{color:var(--bad)}.rules li.warn{color:var(--warn)}.rules li.ok{color:var(--ok)}

.hxs{display:grid;gap:10px}
.hx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;border:2px solid var(--hair);border-radius:14px;padding:10px 12px;background:var(--paper2)}
.hx-f{display:flex;align-items:center;gap:10px;min-width:0}
.hx-f .fic{width:28px;height:32px}
.hx-f b{font-family:var(--fm);font-size:.95rem;overflow-wrap:anywhere}
.hx .bt{display:flex;gap:6px;flex-wrap:wrap}
.bytes{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-family:var(--fm);font-size:.86rem}
.bytes span{border:2px solid var(--hair);border-radius:6px;padding:1px 6px;background:var(--paper)}
.bytes span.sig{border-color:var(--line);background:color-mix(in srgb,var(--sun) 40%,var(--paper));font-weight:700}
.bytes .asc{margin-left:8px;color:var(--muted);border:0;background:none;padding:0}
.hx .why{grid-column:1/-1;font-size:.92rem;font-weight:700}
.hx.ok{border-color:var(--ok);background:var(--okbg)}.hx.no{border-color:var(--bad);background:var(--badbg)}
.sigtbl{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:12px}
.sigtbl th,.sigtbl td{border-top:2px solid var(--hair);padding:5px 8px;text-align:left}
.sigtbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sigtbl td:first-child{font-family:var(--fm);font-weight:700;white-space:nowrap}
.tblwrap{overflow-x:auto}

/* ---------- e-mail with attachment ---------- */
.email{border:2px solid var(--line);border-radius:16px;background:var(--paper2);overflow:hidden;max-width:640px}
.email-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:12px 16px;border-bottom:2px solid var(--hair);font-size:.92rem}
.email-h b{color:var(--muted);font-weight:800}
.email-h span{overflow-wrap:anywhere}
.email-b{padding:12px 16px}
.att{display:inline-flex;align-items:center;gap:10px;margin-top:10px;border:2px solid var(--line);border-radius:12px;padding:6px 12px 6px 6px;background:var(--paper);font-family:var(--fm);font-weight:700;max-width:100%}
.att .fic{width:30px;height:34px}
.att small{font-family:var(--fb);color:var(--muted);font-weight:700}
.att.danger{border-color:var(--bad);background:var(--badbg)}

/* ---------- sizes ---------- */
.ladder{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:800}
.ladder .u{border:2px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--paper);font-family:var(--fm)}
.ladder .x{font-size:.78rem;color:var(--muted)}
.conv{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:12px}
.conv select{border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--paper);font-weight:800}
.convout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.convout div{border:2px solid var(--hair);border-radius:10px;padding:6px 10px;background:var(--paper);font-family:var(--fm);font-size:.86rem;overflow-wrap:anywhere}
.convout b{display:block;font-family:var(--fb);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cp{border:2px solid var(--hair);border-radius:14px;padding:12px;background:var(--paper2);display:grid;gap:8px;align-content:start}
.cp-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800}
.cp-file{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;padding:3px 8px;background:var(--paper);font-family:var(--fm);font-size:.8rem}
.cp-file .fic{width:20px;height:24px}
.usb{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;padding:3px 8px;background:var(--paper);font-size:.82rem}
.usb b{font-family:var(--fm);font-size:.78rem;background:var(--ink);color:var(--paper);border-radius:6px;padding:0 6px}
.cp .q{font-weight:700;font-size:.92rem}
.cp .bt{display:flex;gap:6px}
.cp .why{font-size:.9rem;font-weight:700}
.cp.ok{border-color:var(--ok);background:var(--okbg)}.cp.no{border-color:var(--bad);background:var(--badbg)}

/* ---------- path length counter ---------- */
.meter{height:12px;border-radius:99px;background:var(--soft);border:1px solid var(--hair);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--mint);transition:width .3s}
.meter.over i{background:var(--stop)}
.pathin{width:100%;border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--paper);font-family:var(--fm);font-weight:700;font-size:.86rem}

/* long paths and file names must wrap instead of widening the page */
.opt>span:last-child,.myth p,.fb,.why,.tq h3,.qcard p.q,.missions li>span,.smr .why{min-width:0;overflow-wrap:anywhere}
.broken,.brw-b svg{max-width:100%}

@media (max-width:640px){
  .duo,.cps,.convout{grid-template-columns:minmax(0,1fr)}
  .val-r{grid-template-columns:minmax(0,1fr)}
  .val-in{flex-wrap:wrap}
  .val-in input{flex:1 1 100%}
  .val-in select{flex:1 1 100%;min-width:0;border-left:0;border-top:2px solid var(--hair);padding:6px 8px}
  .fxr{grid-template-columns:minmax(0,1fr) 4.6rem}
  .fxr .ty{display:none}
  .fx-body{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .hx{grid-template-columns:minmax(0,1fr)}
}

function nodeAt(parts){let n=FSYS;for(const p of parts){n=(n.ch||[]).find(c=>c.n===p&&c.ch);if(!n) return null}return n}
function winPath(parts,file){return 'C:\\'+parts.join('\\')+(file?(parts.length?'\\':'')+file:'')}
function lnxPath(parts,file){
  if(parts.length&&parts[0]!=='Users') return null;
  const q=parts.length?['home',...parts.slice(1).map((p,i)=>i===0?p.toLowerCase():p)]:[];
  return '/'+q.join('/')+(file?(q.length?'/':'')+file:'');

function crumbHtml(parts,os,inter){
  const lp=lnxPath(parts),lin=os==='lnx'&&lp!==null;
  const labels=lin?['/',...(lp==='/'?[]:lp.slice(1).split('/'))]:['C:',...parts];
  const sep=c=>`<span class="sep">${c}</span>`;
  let h='';
  labels.forEach((l,i)=>{
    const cur=i===labels.length-1;
    h+=inter?`<button class="crumb${cur?' cur':''}" data-a="crumb" data-v="${i}">${esc(l)}</button>`:`<span class="crumb${cur?' cur':''}">${esc(l)}</span>`;
    if(lin){if(i>0&&!cur) h+=sep('/')}else if(i===0||!cur) h+=sep('\\');
  });
  return h;
}

function analyzeName(base,ext){
  const full=base+ext,out={err:[],warn:[]};
  if(!full.length){out.err.push({k:'empty',t:tr(S3.rEmpty)});return out}
  const bad=[...new Set([...full].filter(c=>BADCH.includes(c)||c.charCodeAt(0)<32))];
  if(bad.length) out.err.push({k:'chars',t:fill(tr(S3.rChars),{c:bad.map(c=>c.charCodeAt(0)<32?'\\x'+c.charCodeAt(0).toString(16):c).join(' ')})});
  const stem=full.split('.')[0].trim().toUpperCase();
  /* Windows 11 rezervuje už len holé meno (CON); s príponou (CON.txt) ho povolí, Windows 10 nie */
  if(RESV.includes(full.trim().toUpperCase())) out.err.push({k:'res',t:fill(tr(S3.rRes),{r:stem})});
  else if(RESV.includes(stem)) out.warn.push({k:'res',t:fill(tr(S3.wRes),{r:stem})});
  if(/[ .]$/.test(full)) out.err.push({k:'trail',t:tr(S3.rTrail)});
  if(full.length>255) out.err.push({k:'long',t:fill(tr(S3.rLong),{n:full.length})});
  if(/ /.test(full)) out.warn.push({k:'space',t:tr(S3.wSpace)});
  if(/[^\x00-\x7F]/.test(full)) out.warn.push({k:'diac',t:tr(S3.wDiac)});
  const oth=[...new Set([...full].filter(c=>'#%&{}$!\'@+`=()[];,~'.includes(c)))];
  if(oth.length) out.warn.push({k:'other',t:fill(tr(S3.wOther),{c:oth.join(' ')})});
  const dots=(full.match(/\./g)||[]).length;
  if(dots>1&&!/^\.[^.]+$/.test(full)) out.warn.push({k:'dots',t:fill(tr(S3.wDots),{x:full.slice(full.lastIndexOf('.'))})});
  if(/[A-Z]/.test(full)) out.warn.push({k:'case',t:tr(S3.wCase)});
  if(full.length>60&&full.length<=255) out.warn.push({k:'longish',t:fill(tr(S3.wLongish),{n:full.length})});
  return out;
}

function testScore(){const o=S.test.order||[];return o.reduce((s,x,k)=>s+(S.test.a[k]===TQ[x.q].c?1:0),0)}
function gradeOf(p){return p>=90?1:p>=75?2:p>=50?3:p>=30?4:5}
function testInit(){S.test.order=shuffle(TQ.map((_,i)=>i)).map(q=>({q,p:shuffle([...Array(TQ[q].o.length).keys()])}));S.test.i=0;S.test.a=[];S.test.done=false}
function testBlock(){
  const T8=S.test,n=TQ.length;
  if(!T8.order) return `<div class="tq"><p>${ico('list')} <b>${n}</b> · ${Object.values(TOP).map(x=>tr(x)).join(' · ')}</p><div class="row mt"><button class="btn" data-a="tstart">${ico('play')} ${tr(S8.start)}</button></div></div>`;
  const dots=`<div class="tdots" aria-hidden="true">${T8.order.map((x,k)=>{const a=T8.a[k];return `<i class="${a==null?(k===T8.i&&!T8.done?'cur':''):a===TQ[x.q].c?'ok':'no'}"></i>`}).join('')}</div>`;
  if(T8.done){
    const s=testScore(),p=Math.round(s/n*100),g=gradeOf(p);
    const by=Object.keys(TOP).map(k=>{const idx=T8.order.map((x,i)=>[x,i]).filter(([x])=>TQ[x.q].t===k);return `<span>${tr(TOP[k])}: ${idx.filter(([x,i])=>T8.a[i]===TQ[x.q].c).length}/${idx.length}</span>`}).join('');
    return `<div class="result"><div class="gradebox"><div class="grade" aria-label="${tr(S8.gradeL)} ${g}">${g}</div><small>${tr(S8.grades[g-1])}</small></div><div><h3>${fill(tr(S8.res),{s,n,p})}</h3><p>${tr(S8.msg[g-1])}</p><div class="bytopic">${by}</div>${dots}<p class="small mt">${fill(tr(S8.best),{b:T8.best??s,n})}</p><div class="row mt"><button class="btn ghost sm" data-a="tretry">${ico('reset')} ${tr(S8.retry)}</button></div></div></div>`;
  }
  const it=T8.order[T8.i],q=TQ[it.q],a=T8.a[T8.i],ans=a!=null,L='ABCD';
  let h=`<div class="tq"><div class="tq-meta"><span>${fill(tr(S8.qn),{i:T8.i+1,n})}</span><span class="topic">${tr(TOP[q.t])}</span></div>${dots}<h3 class="mt">${tr(q.q)}</h3><div class="opts${ans?' locked':''}" role="group">`;
  it.p.forEach((oi,k)=>{let cls='',mk=L[k];if(ans){if(oi===q.c){cls='ok';mk=ico('check')}else if(oi===a){cls='no';mk=ico('x')}}
    h+=`<button class="opt ${cls}" data-a="tans" data-v="${oi}"${ans?' aria-disabled="true"':''}><span class="mk">${mk}</span><span>${tr(q.o[oi])}</span></button>`});
  h+='</div>';
  if(ans) h+=`<div class="fb ${a===q.c?'ok':'no'}" role="status"><b>${a===q.c?t('correct'):t('wrong')}</b> ${tr(q.ex)}</div><div class="row mt"><button class="btn" data-a="tnext">${T8.i+1<n?tr(S8.next):tr(S8.eval)} ${ico('arrow')}</button></div>`;
  return h+'</div>';
}
function certHtml(){
  const s=S.test.done?testScore():null,n=TQ.length,nm=S.name.trim();
  const d=new Date().toLocaleDateString(loc(),{year:'numeric',month:'long',day:'numeric'});
  return `<div class="cert"><div class="cseal">${tr(S8.cseal)}</div><div class="ct">${tr(S8.ct)}</div><p>${tr(S8.cfor)}</p><div class="cn" id="certName">${esc(nm||tr(S8.noName))}</div><p>${tr(S8.cdid)}</p>`+
    `<span class="cr">${tr(S8.crank)}: ${esc(rankName(rankIdx(xpTotal())))}</span>`+
    `<p class="mt"><b>${tr(S8.cxp)}:</b> ${xpTotal()} / ${MAXT}${s!=null?` · <b>${tr(S8.ctest)}:</b> ${s} / ${n} (${Math.round(s/n*100)} %)`:''}</p>`+
    `<div class="cf"><span>${tr(S8.cdate)}: ${d}</span><span>${tr(S8.csub)}</span></div></div>`;
}
function certBlock(){

function plOut(){

}

/* keep the current folder visible at the end of long address bars */
const addrEnd=el=>el.querySelectorAll('.addr').forEach(a=>{a.scrollLeft=a.scrollWidth});
['s1','s2'].forEach(id=>{const prev=AFTER[id];AFTER[id]=el=>{if(prev) prev(el);addrEnd(el)}});
function init(){
  {const sl=store.get(LKEY);if(sl==='0'||sl==='1') LI=+sl;}
  const th=store.get('kb-theme');if(th==='dark'||th==='light') document.documentElement.dataset.theme=th;
  if(store.get('kb-board')==='1') document.documentElement.classList.add('board');
  loadState();
  document.documentElement.lang=LI?'hu':'sk';document.title=t('title');
  renderAll();
  addEventListener('resize',()=>setPad());
  try{new ResizeObserver(()=>setPad()).observe($('#top'))}catch(e){}
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.matches&&e.target.matches('[data-in="uq1"]')){e.preventDefault();A.uq1()}});
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme) renderTop()})}catch(e){}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>setPad());
  $('#tdlg').addEventListener('click',e=>{if(e.target.id==='tdlg') A.tdclose()});
  addEventListener('hashchange',()=>{renderTop();setPad()});
  const h=location.hash.slice(1);if(h&&/^[\w-]+$/.test(h)&&document.getElementById(h)) setTimeout(()=>document.getElementById(h).scrollIntoView(),60);
}
init();
</script>
