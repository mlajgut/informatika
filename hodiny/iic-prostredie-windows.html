    if(!ok) continue;
    S.done[s.id]=1;S.doneAt[s.id]=S.act.t;JUST=s.id;nd.push(s.id);persist();
    const id=s.id;setTimeout(()=>{if(JUST===id)JUST=null},1400);
    setTimeout(()=>toast(`<span class="stampy">${t('done')}</span> ${fill(t('secDone'),{n:esc(tr(s.tab))})}`,2600),900);

/* multiple-choice block: q={o:[[sk,hu]...],c:index,ex:[sk,hu]} */
function permFor(key,n){
  let h=2166136261;for(const ch of key){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function mcq(name,q,picked,opt={}){

  permFor(name,q.o.length).forEach((i,k)=>{
    const o=q.o[i];

/* ---------- floating countdown timer ---------- */
const TM={end:0,left:0,run:false,done:false,sec:0,iv:0};
let AC=null;
function audioUnlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function beep(){
  if(!AC) return;
  try{const now=AC.currentTime;[0,.32,.64].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(.22,now+d+.02);g.gain.exponentialRampToValueAtTime(.0001,now+d+.24);
    o.connect(g);g.connect(AC.destination);o.start(now+d);o.stop(now+d+.28)})}catch(e){}
}
function startTimer(min,sec){
  audioUnlock();
  TM.left=min*60000;TM.end=Date.now()+TM.left;TM.run=true;TM.done=false;TM.sec=sec;
  clearInterval(TM.iv);TM.iv=setInterval(tick,250);renderTimer();
}
function tick(){
  if(TM.run){TM.left=Math.max(0,TM.end-Date.now());if(TM.left===0){TM.run=false;TM.done=true;beep();toast(`${ico('clock')} ${t('timeUp')}`,2600);renderTimer();}}
  paintTimer();
}
function renderTimer(){
  const el=$('#timer'),f=grabFocus(el);el.hidden=false;
  el.innerHTML=`${ico('clock')}<span class="tt" id="tt" aria-live="off"></span><span class="tl">${esc(tr(SECS[TM.sec].tab))}</span>`+
    `<button data-a="tpause" aria-label="${t(TM.run?'pause':'resume')}" title="${t(TM.run?'pause':'resume')}">${ico(TM.run?'pause':'play')}</button>`+
    `<button data-a="tplus" aria-label="${t('plus1')}" title="${t('plus1')}"><b>+1</b></button>`+
    `<button data-a="tclose" aria-label="${t('close')}" title="${t('close')}">${ico('x')}</button>`;
  putFocus(el,f);paintTimer();
}
function paintTimer(){
  const s=Math.ceil(TM.left/1000),el=$('#tt');
  if(el) el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  $('#timer').classList.toggle('ding',TM.done);
}
A.timer=el=>{const i=+el.dataset.v;startTimer(SECS[i].min,i)};
A.tpause=()=>{if(TM.run){TM.run=false;TM.left=Math.max(0,TM.end-Date.now())}else if(TM.left>0){TM.end=Date.now()+TM.left;TM.run=true}renderTimer()};
A.tplus=()=>{TM.left+=60000;TM.done=false;if(TM.run)TM.end+=60000;else{TM.end=Date.now()+TM.left;TM.run=true}renderTimer()};
A.tclose=()=>{clearInterval(TM.iv);TM.run=false;$('#timer').hidden=true};

function gradeOf(p){return p>=90?1:p>=75?2:p>=50?3:p>=25?4:5}
function testScore(){const o=S.test.order||[];return o.reduce((s,x,k)=>s+(S.test.a[k]===TQ[x.q].c?1:0),0)}

const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
/* hodnotenie hodiny: test 40 %, úlohy 40 %, aktívny čas 20 % */
function tasksPct(){let e=0;for(const [k,v] of Object.entries(S.xp)) if(TASKPFX.some(p=>k.startsWith(p))) e+=+v||0;return Math.round(Math.min(1,e/TASKMAX)*100)}
function timePct(){return Math.round(Math.min(1,S.act.t/(LESSON.goodMin*60))*100)}
function testPct(){return S.test.first==null?null:Math.round(S.test.first/TQ.length*100)}
function totalPct(){const tp=testPct();return tp==null?null:Math.round(.4*tp+.4*tasksPct()+.2*timePct())}
const MAND=()=>SECS.filter(s=>!s.bonus);

    xp:xpTotal(),xpMax:MAXT,tasks:tasksPct(),time:timePct(),

const IMPKEY=KEY+'-trieda';
let IMP=(()=>{try{return JSON.parse(store.get(IMPKEY)||'[]')}catch(e){return []}})(),IMPMSG='';
let RESETQ=false;
function impRows(){
  return IMP.map(r=>{const c={...r};delete c.sig;const okSig=sig(c)===r.sig;
    return {r,okSig,other:r.lesson!==LESSON.id}}).sort((a,b)=>(a.r.klass+a.r.name).localeCompare(b.r.klass+b.r.name,'sk'));
}
function impTable(){
  if(!IMP.length) return `<p class="small">${TD.none}</p>`;
  return `<div class="ptwrap"><table class="itbl"><thead><tr>${TD.rc.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${impRows().map(({r,okSig,other})=>`<tr><td>${esc(r.name)}</td><td>${esc(r.klass)}</td><td>${mmss(+r.active||0)}</td><td>${(r.done||[]).length} / ${MAND().length}${(r.bonusDone||[]).length?` +${r.bonusDone.length}★`:''}</td><td>${r.tasks} %</td><td>${r.test&&r.test.pct!=null?r.test.pct+' %':'–'}</td><td>${r.time} %</td><td><b>${r.total!=null?r.total+' %':'–'}</b></td><td><b>${r.grade??'–'}</b></td><td class="${okSig&&!other?'ok':'bad'}">${other?TD.other:okSig?TD.sigOk:TD.sigBad}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderTeacher(){
  const li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  return `<div class="tdlg-h"><h2 id="tdlgT">${ico('cap')} ${TD.h}</h2><button class="iconbtn sq" data-a="tdclose" aria-label="${t('close')}">${ico('x')}</button></div><div class="tdlg-b">`+
    `<section><h3>Ciele hodiny</h3>${li(H0.goals.map(g=>g[0]))}</section>`+
    `<section><h3>${TD.stdH}</h3><div class="std">${TD.std.map(x=>`<p>${x}</p>`).join('')}</div></section>`+
    `<section><h3>${TD.planH}</h3><div class="ptwrap"><table class="ptbl"><thead><tr>${TD.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${TD.plan.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]==='–'?'–':p[1]+' · '+esc(SECS[+p[1]-1].tab[0])}</td><td>${p[2]}</td></tr>`).join('')}</tbody></table></div><p class="small mt">${TD.bonus}</p></section>`+
    `<section><h3>${TD.sayH}</h3><div class="say">${TD.say.map(([c,x])=>`<p style="--c:var(--${c})">${x}</p>`).join('')}</div></section>`+
    `<section><h3>${TD.warmH}</h3><ol>${TD.warm.map(x=>`<li>${x}</li>`).join('')}</ol></section>`+
    `<section><h3>${TD.gradeH}</h3>${li(TD.grade)}</section>`+
    `<section><h3>${TD.resH}</h3><div class="imp"><p class="small">${TD.resHow}</p>${INFRAME?`<div class="fb warn">${TD.frame}</div>`:''}<label class="btn ghost sm" style="cursor:pointer">${ico('upload')} ${TD.impL}<input type="file" accept=".json,application/json" multiple data-ch="imp" class="sr"></label>`+
      `${IMPMSG?`<div class="fb warn">${IMPMSG}</div>`:''}<p class="small"><b>${fill(TD.impN,{n:IMP.length})}</b></p>${impTable()}`+
      (IMP.length?`<div class="row"><button class="btn mint sm" data-a="impcsv">${ico('download')} ${TD.csv}</button><button class="btn ghost sm" data-a="impclr">${ico('reset')} ${TD.clr}</button></div>`:'')+`</div></section>`+
    `<section><h3>${TD.tipsH}</h3>${li(TD.tips)}</section>`+
    `<section><label class="row" style="cursor:pointer"><input type="checkbox" data-ch="board" ${document.documentElement.classList.contains('board')?'checked':''} style="width:20px;height:20px;accent-color:var(--mint)"> <b>${ico('board')} ${TD.boardL}</b></label></section>`+
    `<section><h3>${TD.resetH}</h3>${RESETQ?`<div class="fb warn"><p><b>${TD.resetQ}</b></p><div class="row mt"><button class="btn coral sm" data-a="tresetYes">${ico('reset')} ${TD.yes}</button><button class="btn ghost sm" data-a="tresetNo">${TD.no}</button></div></div>`:`<button class="btn ghost sm" data-a="treset">${ico('reset')} ${TD.resetB}</button>`}</section>`+
    `<section><h3>${TD.srcH}</h3><ul>${TD.src.map(s=>`<li><a href="${s[0]}" target="_blank" rel="noopener noreferrer">${s[1]}</a></li>`).join('')}</ul><p class="small mt">${t('author')}</p></section></div>`;
}
function teacherPaint(){const d=$('#tdlg'),f=grabFocus(d);d.innerHTML=renderTeacher();putFocus(d,f)}
A.teacher=()=>{const d=$('#tdlg');RESETQ=false;IMPMSG='';d.innerHTML=renderTeacher();
  if(typeof d.showModal==='function'){try{d.showModal()}catch(e){d.setAttribute('open','')}}else d.setAttribute('open','');
  const c=d.querySelector('[data-a="tdclose"]');if(c) c.focus({preventScroll:true})};
A.tdclose=()=>{const d=$('#tdlg');try{d.close()}catch(e){d.removeAttribute('open')}};
A.treset=()=>{RESETQ=true;teacherPaint();const b=$('#tdlg [data-a="tresetNo"]');if(b) b.focus({preventScroll:true})};
A.tresetNo=()=>{RESETQ=false;teacherPaint()};
A.tresetYes=()=>{store.del(KEY);S=S0();S.act.first=new Date().toISOString();S.act.sessions=1;RESETQ=false;resetTransient();renderAll();teacherPaint();toast(`${ico('reset')} ${TD.resetDone}`,2200)};
CH.board=el=>{document.documentElement.classList.toggle('board',el.checked);store.set('kb-board',el.checked?'1':'0');setPad()};
CH.imp=el=>{
  const files=[...(el.files||[])];IMPMSG='';let left=files.length;if(!left) return;
  const bad=[];
  files.forEach(f=>{const rd=new FileReader();
    rd.onload=()=>{try{const r=JSON.parse(rd.result);if(!r||r.app!=='inf-hodina'||typeof r.name!=='string') throw 0;
        const i=IMP.findIndex(x=>x.lesson===r.lesson&&x.name===r.name&&x.klass===r.klass);if(i>=0) IMP[i]=r;else IMP.push(r)}catch(e){bad.push(f.name)}
      if(--left===0) impDone(bad)};
    rd.onerror=()=>{bad.push(f.name);if(--left===0) impDone(bad)};
    rd.readAsText(f)});
};
function impDone(bad){store.set(IMPKEY,JSON.stringify(IMP));IMPMSG=bad.map(f=>fill(TD.impBad,{f:esc(f)})).join('<br>');teacherPaint()}
A.impclr=()=>{IMP=[];store.del(IMPKEY);IMPMSG='';teacherPaint()};
A.impcsv=()=>{
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['Meno','Trieda','Hodina','Aktívny čas (min)','Povinné šanóny','Bonusové šanóny','Úlohy %','Test body','Test %','Čas %','Spolu %','Známka','Kontrola','Uložené'];
  const rows=impRows().map(({r,okSig,other})=>[r.name,r.klass,r.lessonName,(Math.round((+r.active||0)/6)/10).toString().replace('.',','),(r.done||[]).length,(r.bonusDone||[]).length,r.tasks,r.test?r.test.first:'',r.test?r.test.pct:'',r.time,r.total,r.grade,other?TD.other:okSig?TD.sigOk:TD.sigBad,r.saved]);
  download(`${LESSON.id}_vysledky.csv`,'﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');
};
let LASTIN=Date.now();
function curSec(){const y=innerHeight*.4;for(const s of SECS){const el=document.getElementById(s.id);if(!el) continue;const r=el.getBoundingClientRect();if(r.top<=y&&r.bottom>y) return s.id}return null}
function trackTick(){
  if(document.visibilityState!=='visible') return;
  try{if(!document.hasFocus()) return}catch(e){}
  if(Date.now()-LASTIN>60000) return;
  S.act.t++;const s=curSec();if(s) S.act.sec[s]=(S.act.sec[s]||0)+1;
  if(S.act.t%10===0) persist();
  const el=$('#actT');if(el) el.textContent=mmss(S.act.t);
}

function resetTransient(){
  WSEL=null;LSEL=null;LFB=null;TSEL=null;TFB=null;
  Object.assign(TB,{win:'open',desk:false,fly:null,msg:'say0'});
  Object.assign(SM,{open:false,q:'',menu:null,run:null,msg:'say0',arg:''});
  clearInterval(HT.iv);Object.assign(HT,{run:false,order:[],opts:[],i:0,t0:0,miss:0,iv:0,msg:'',mcls:'',fin:null});
  for(const k of Object.keys(HLAST)) delete HLAST[k];
  for(const k of Object.keys(PWLAST)) delete PWLAST[k];
  JUST=null;
}
function init(){
  const th=store.get('kb-theme');if(th==='dark'||th==='light') document.documentElement.dataset.theme=th;
  if(store.get('kb-board')==='1') document.documentElement.classList.add('board');
  {const sl=store.get(LKEY);if(sl==='0'||sl==='1') LI=+sl;}
  loadState();
  if(!S.act.first) S.act.first=new Date().toISOString();
  S.act.sessions=(S.act.sessions||0)+1;persist();
  document.documentElement.lang=LI?'hu':'sk';document.title=t('title');
  renderAll();
  ['pointerdown','keydown','wheel','touchstart','input','scroll'].forEach(ev=>addEventListener(ev,()=>{LASTIN=Date.now()},{passive:true,capture:true}));
  setInterval(trackTick,1000);
  /* súhrn a certifikát držíme aktuálne – aktívny čas mení percentá aj známku */
  setInterval(()=>{if(document.visibilityState!=='visible') return;if($('#sumBox')) sumRefresh();const c=$('#certBox');if(c) c.innerHTML=certHtml()},5000);
  addEventListener('pagehide',()=>store.set(KEY,JSON.stringify(S)));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') store.set(KEY,JSON.stringify(S))});
  addEventListener('resize',()=>setPad());
  try{new ResizeObserver(()=>setPad()).observe($('#top'))}catch(e){}
  document.addEventListener('keydown',e=>{
    const tg=e.target;
    if(e.key==='Enter'&&tg&&tg.matches&&tg.matches('[data-in="sb"]')){e.preventDefault();A.sbchk(tg)}
    if(e.key==='Escape'&&SM.open&&tg&&tg.closest&&tg.closest('#s4')){SM.open=false;SM.menu=null;SM.msg='closed';rr('s4')}
  });
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme) renderTop()})}catch(e){}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>setPad());
  $('#tdlg').addEventListener('click',e=>{if(e.target.id==='tdlg') A.tdclose()});
  addEventListener('hashchange',()=>{renderTop();setPad();if(false&&STUDENT) A.teacher()});
  const h=location.hash.slice(1);if(h&&/^[\w-]+$/.test(h)&&document.getElementById(h)) setTimeout(()=>document.getElementById(h).scrollIntoView(),60);
}
init();
